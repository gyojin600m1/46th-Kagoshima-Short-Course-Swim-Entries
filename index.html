<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self' https://abacus.jasoncameron.dev; base-uri 'none'; form-action 'none'">
<title>第46回 県短水路記録会 エントリー確認</title>
<style>
:root{
  /* ---- 男女色（毎回固定・変更禁止） ---- */
  --male:#1565c0; --female:#b71c6e;
  --maleText:#6fb7ff; --femaleText:#ff92c2;
  /* ---- 地の色 ---- */
  --bg:#0a0f1c; --bg2:#0d1220;
  --card:#121b2e; --card2:#0f1729;
  --border:#263149; --border2:#1b2740;
  --text:#e8eefc; --muted:#8fa3c8; --dim:#6b7c9e;
  --accent:#4da3ff; --accentDim:#2b6db8;
  --gold:#ffcc66;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:14px;line-height:1.5;
  overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}

/* ================= ヘッダー（軽量・固定） ================= */
.hd{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,#0a1628,#0d2547);
  border-bottom:1px solid var(--border);
  padding:8px 12px 0;
}
.hd-top{display:flex;align-items:center;gap:9px;min-width:0}
.hd-ico{
  flex:0 0 auto;width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#3d8ee0,#6fb7ff);
  display:flex;align-items:center;justify-content:center;font-size:17px
}
.hd-txt{min-width:0;flex:1}
.hd-t{font-size:15px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.live{display:inline-flex;align-items:center;gap:4px;margin-left:7px;padding:2px 8px;
  border-radius:999px;background:#c62828;color:#fff;font-size:10.5px;font-weight:800;
  vertical-align:middle;white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:lv 1.6s ease-in-out infinite}
@keyframes lv{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.hd-s{font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px;overflow-wrap:anywhere}

/* タブ：必ず 52px 以上・5個が375pxに収まる */
.tabs{display:flex;gap:2px;margin-top:7px}
.tab{
  flex:1 1 0;min-width:0;
  min-height:52px;padding:5px 1px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border-radius:9px 9px 0 0;background:transparent;border:0;
  color:var(--muted);font-size:10.5px;font-weight:600;line-height:1.15;
  cursor:pointer;white-space:nowrap
}
.tab .em{font-size:15px;line-height:1}
.tab .ln{line-height:1.15;text-align:center}
.tab.on{background:var(--bg);color:var(--accent)}
.tab.hot{color:var(--gold);background:rgba(255,204,102,.13);box-shadow:inset 0 0 0 1px rgba(255,204,102,.35)}
.tab.hot.on{background:var(--gold);color:#241a00;box-shadow:none;font-weight:800}

/* ================= 共通パーツ ================= */
.wrap{padding:12px 12px 40px;max-width:720px;margin:0 auto}
.seg{display:flex;gap:6px;margin-bottom:9px}
.seg button{
  flex:1;min-height:48px;border-radius:11px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer
}
.seg button.on{background:var(--accentDim);border-color:var(--accent);color:#fff}
.seg button.on.m{background:var(--male);border-color:var(--maleText)}
.seg button.on.f{background:var(--female);border-color:var(--femaleText)}

.field{display:flex;gap:6px;margin-bottom:9px}
.field input{
  flex:1;min-width:0;min-height:48px;padding:0 14px;
  border-radius:11px;border:1px solid var(--border);background:var(--card2);font-size:15px
}
.field input::placeholder{color:var(--dim);font-size:13px}
.field button{
  flex:0 0 auto;min-height:48px;padding:0 16px;border-radius:11px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);font-weight:700;cursor:pointer
}
select{
  width:100%;min-height:48px;padding:0 34px 0 13px;margin-bottom:9px;
  border-radius:11px;border:1px solid var(--border);background:var(--card2);
  font-size:14px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 22px,calc(100% - 13px) 22px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:19px;
  border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:12.5px;cursor:pointer
}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.stat{
  min-width:0;background:var(--card2);border:1px solid var(--border2);
  border-radius:10px;padding:6px 2px;text-align:center
}
.stat b{display:block;font-size:16px;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:9.5px;color:var(--dim);line-height:1.25;overflow-wrap:anywhere}

.note{
  background:var(--card2);border:1px solid var(--border2);border-left:3px solid var(--accentDim);
  border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--muted);line-height:1.65;margin-bottom:10px
}

.gsec{display:flex;align-items:center;gap:7px;margin:16px 0 8px;font-weight:700;font-size:14px}
.gsec.m{color:var(--maleText);border-bottom:2px solid var(--male);padding-bottom:5px}
.gsec.f{color:var(--femaleText);border-bottom:2px solid var(--female);padding-bottom:5px}
.gsec.x{color:var(--text);border-bottom:2px solid var(--male);border-image:linear-gradient(90deg,var(--male),var(--female)) 1;padding-bottom:5px}
.gsec .n{margin-left:auto;font-size:12px;color:var(--dim);font-weight:600}
.og{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.og .nm{font-size:15px;font-weight:800;color:var(--text)}
.og .n{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600}
.orow{background:var(--card);border:1px solid var(--border2);border-radius:11px;
  padding:10px 12px 10px 15px;margin-bottom:7px;position:relative;overflow:hidden}
.orow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--male)}
.orow.f::before{background:var(--female)}
.orow .to{font-size:17px;font-weight:800;color:var(--gold);letter-spacing:.2px;line-height:1.25}
.orow .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.orow .who .nm{font-size:13.5px;font-weight:700}
.orow .from{margin-top:5px;font-size:11.5px;color:var(--muted);line-height:1.5}
.orow .ev{display:block;margin-top:3px;font-size:11.5px;color:var(--dim);line-height:1.5}
.rlhd{padding:6px 0 2px;font-size:11.5px;font-weight:700;color:var(--accent)}
.rlhd .dim{color:var(--dim);font-weight:400}
.orow .ogev{display:inline-flex;align-items:center;gap:4px;margin:4px 6px 0 0;padding:5px 9px;
  min-height:30px;border:1px solid var(--border);border-radius:999px;color:var(--text);
  font-size:11.5px;cursor:pointer;background:var(--card2)}
.orow .ogev .pill{margin:0}
.orow .rlv{display:block;margin-top:5px;font-size:11.5px;line-height:1.55;color:var(--muted)}
.orow .rlv b{color:var(--accent);font-weight:700}
.orow .rlv .dim{color:var(--dim)}
.ostat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.ostat div{background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:8px 2px;text-align:center}
.ostat b{display:block;font-size:22px;color:var(--gold);line-height:1.1}
.ostat span{font-size:10.5px;color:var(--dim)}
.tsec{display:flex;align-items:center;gap:7px;margin:14px 0 7px;font-size:12.5px;font-weight:700;
  color:var(--muted);padding:0 2px 4px;border-bottom:1px dashed var(--border2)}
.tsec .n{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600}

.count{text-align:center;color:var(--muted);font-size:12.5px;margin:6px 0 10px}
.count b{color:var(--accent);font-size:15px}
.empty{text-align:center;color:var(--dim);padding:44px 16px;font-size:13px;line-height:1.9}
.empty .e{font-size:34px;display:block;margin-bottom:10px}

/* ================= 選手カード（70px・左5pxライン） ================= */
.sw{
  position:relative;background:var(--card);border:1px solid var(--border2);
  border-radius:11px;padding:9px 11px 9px 15px;margin-bottom:7px;
  overflow:hidden;cursor:pointer
}
.sw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--male)}
.sw.f::before{background:var(--female)}
.sw.x::before{background:linear-gradient(180deg,var(--male) 50%,var(--female) 50%)}
.sw-r1{display:flex;align-items:baseline;gap:7px;min-width:0}
.sw-nm{font-size:15px;font-weight:700;overflow-wrap:anywhere;min-width:0}
.sw-kn{font-size:10.5px;color:var(--dim);overflow-wrap:anywhere}
.sw-bd{
  margin-left:auto;flex:0 0 auto;font-size:11.5px;font-weight:700;
  color:var(--accent);background:rgba(77,163,255,.13);
  border-radius:13px;padding:3px 9px;white-space:nowrap
}
.sw-r2{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0;flex-wrap:wrap}
.sw-tm{font-size:12px;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.pill{flex:0 0 auto;font-size:10.5px;border-radius:5px;padding:2px 7px;background:var(--card2);color:var(--muted);border:1px solid var(--border2)}
.pill.m{background:var(--male);color:#fff;border-color:transparent;font-weight:700}
.pill.f{background:var(--female);color:#fff;border-color:transparent;font-weight:700}
.pill.x{background:linear-gradient(90deg,var(--male),var(--female));color:#fff;border-color:transparent;font-weight:700}
.pill.t{color:var(--gold);border-color:rgba(255,204,102,.35);font-weight:700;font-variant-numeric:tabular-nums}
.pill.r{color:var(--muted);border-color:var(--border);font-weight:700}
.pill.ov{color:var(--muted);border-color:var(--border);font-weight:700}
.pill.ent{color:var(--accent);border-color:rgba(77,163,255,.4)}
.pill.nr{background:linear-gradient(135deg,#ff6b2c,#ff3d3d);color:#fff;border-color:transparent;
  font-weight:800;letter-spacing:.3px}
.nrmk{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:1px 7px;border-radius:999px;
  background:linear-gradient(135deg,#ff6b2c,#ff3d3d);color:#fff;font-size:10.5px;font-weight:800;
  vertical-align:middle;white-space:nowrap}
.pill.rk{background:rgba(255,204,102,.16);color:var(--gold);border-color:transparent;font-weight:800}
.pill.rk.m1{background:var(--gold);color:#241a00}
.pill.rk.ng{background:rgba(140,155,185,.16);color:var(--muted)}
.pill.adv{background:rgba(64,200,120,.16);color:#7ee2a8;border-color:transparent;font-weight:800}
.rkno{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;
  margin:0 6px 0 0;padding:0 5px;border-radius:7px;font-size:12px;font-weight:800;
  background:rgba(255,204,102,.13);color:var(--gold)}
.rkno.m1{background:var(--gold);color:#241a00}
.rtime{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.pill.hl{background:var(--gold);color:#241a00;border-color:transparent;font-weight:700}
.mem{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7;word-break:break-word}
.mem .mh{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:6px;
  background:rgba(140,155,185,.14);color:var(--muted);font-size:11px}
/* ---------- 当日プラン（meta.dayPlan があるときだけ） ---------- */
.tl{position:relative;padding-left:64px}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tlr{position:relative;margin-bottom:8px;background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding:9px 11px}
.tlr .ti{position:absolute;left:-64px;top:10px;width:46px;text-align:right;
  font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tlr::before{content:"";position:absolute;left:-16px;top:14px;width:9px;height:9px;border-radius:50%;
  background:var(--border);box-shadow:0 0 0 3px var(--bg)}
.tlr .tt{font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
.tlr .tn{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;overflow-wrap:anywhere}
.tlr.fuel{border-color:rgba(255,204,102,.35)}
.tlr.fuel::before{background:var(--gold)}
.tlr.fuel .tt{color:var(--gold)}
.tlr.call{border-color:rgba(90,160,255,.35)}
.tlr.call::before{background:var(--accent)}
.tlr.call .tt{color:var(--accent)}
.tlr.race{padding-left:14px}
.tlr.race::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--male);
  border-radius:11px 0 0 11px}
.tlr.race.f::after{background:var(--female)}
.tlr.race::before{background:var(--maleText)}
.tlr.race.f::before{background:var(--femaleText)}
.tlr.race .ti{color:var(--text)}
.tlr.race .tt{font-size:15px}
.tlr.down::before{background:#3fb27f}
.tlr.down .tt{color:#5fd3a0}
.tlr.fix{background:transparent;border-style:dashed}
.tlr.fix .tt{font-weight:600;color:var(--muted);font-size:12.5px}
/* ---------- 当日プラン：チェック・次の予定・自分の入力（親子の1日ナビから） ---------- */
.tlr .ck{display:flex;align-items:flex-start;gap:8px;cursor:pointer;min-width:0}
.tlr .ck input{flex:0 0 auto;width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.tlr .ck .tt{flex:1;min-width:0}
.tlr .ck .pill{margin-top:1px}
.tlr .tn,.tlr .sub{margin-left:30px}
.tlr.dn{opacity:.5}
.tlr.dn .tt{text-decoration:line-through}
.tlr.meal{border-color:rgba(255,204,102,.35)}
.tlr.meal::before{background:var(--gold)}
.tlr.meal .tt{color:var(--gold)}
.tlr.prep::before{background:#9b8cff}
.tlr.prep .tt{color:#c3b9ff}
.tlr.mine{border-style:dashed;border-color:rgba(77,163,255,.45)}
.tlr.mine::before{background:var(--accent)}
.dpback{min-height:48px;width:100%;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);margin-bottom:10px}
.dpbtn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--accent);font-weight:700;cursor:pointer}
.dplink{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;min-height:32px;cursor:pointer;text-decoration:underline}
.dpsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.dpsel .chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px 0 12px;border-radius:22px;
  background:var(--card);border:2px solid var(--male);font-weight:700;font-size:13.5px;max-width:100%}
.dpsel .chip.f{border-color:var(--female)}
.dpsel .chip small{font-size:10.5px;color:var(--dim);font-weight:600}
.dpsel .chip button{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);color:var(--muted);font-size:17px;cursor:pointer}
.dpnext{background:linear-gradient(135deg,#14294a,#0f1e38);border:1px solid var(--accent);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.dpnext .lb{font-size:11px;color:var(--accent);font-weight:700}
.dpnext .nx{font-size:17px;font-weight:800;margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.dpnext .nx b{color:var(--gold);margin-right:8px;font-variant-numeric:tabular-nums}
.dpnext .tn{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.dpnext button{margin-top:8px;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:#04203f;font-weight:800;cursor:pointer}
.note.dpw{border-left-color:var(--gold);color:var(--gold)}
details.dpd{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:0 12px}
details.dpd>summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:13.5px;color:var(--accent);cursor:pointer;list-style:none}
details.dpd>summary::-webkit-details-marker{display:none}
details.dpd>summary::after{content:"▾";margin-left:auto;color:var(--dim)}
details.dpd[open]>summary::after{content:"▴"}
details.dpd .in{padding:0 0 12px}
details.dpd .tn{font-size:12px;color:var(--muted);line-height:1.7;margin:2px 0 4px}
.dpf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dpf .full{grid-column:1/-1}
.dpf label,.dpl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0;margin-bottom:6px}
.dpf input,.dpl input,.dpl textarea,.dpc input{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  padding:0 10px;font-size:16px;color:var(--text);width:100%;min-width:0;color-scheme:dark}
.dpl textarea{min-height:84px;padding:10px;resize:vertical;font-family:inherit}
.dph{margin:12px 0 6px;font-size:12.5px;font-weight:700;color:var(--text)}
.dpc{display:grid;grid-template-columns:104px minmax(0,1fr) 44px;gap:6px;margin-bottom:6px}
.dpc button{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:16px;cursor:pointer}
.dpfood{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0 2px}
.dpfood button{min-height:44px;text-align:left;padding:7px 9px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  color:var(--text);font-size:12px;line-height:1.4;cursor:pointer}
.dpfood button b{display:block;font-weight:700}
.dpfood button span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.dpfood button[aria-pressed=true]{border:2px solid var(--gold);background:rgba(255,204,102,.12)}
.dpact{display:flex;gap:8px;margin:4px 0 12px}
.dpact .dpbtn{flex:1}
.dpkit label{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13.5px;cursor:pointer}
.dpkit input{width:22px;height:22px;accent-color:var(--accent)}
.dpref{margin:0;padding-left:1.2em;font-size:12px;line-height:1.8}
.dpref a{color:var(--accent)}
.dpsave{font-size:11px;color:var(--dim);text-align:center;margin:8px 0 0}
@media (max-width:360px){.dpfood{grid-template-columns:1fr}}
@media print{
  html,body{background:#fff!important;color:#111!important}
  .hd,.ft,.ch,.dpact,.dpsel button,.dpback,.dpnext button,details.dpd,.dplink,.dpfood,.dpsave{display:none!important}
  .wrap{max-width:none;padding:0}
  .note,.tlr,.dpnext,.dpsel .chip{background:#fff!important;color:#111!important;border-color:#bbb!important}
  .tlr{break-inside:avoid}
  .tlr .tt,.tlr .ti,.tlr .tn,.dpnext .nx,.dpnext .lb{color:#111!important}
  .tl::before{background:#bbb}
}
.sw.hl{box-shadow:inset 0 0 0 1px rgba(255,204,102,.45)}
.ln.hl{box-shadow:inset 0 0 0 1px rgba(255,204,102,.45)}
.chips button.hl{border-color:rgba(255,204,102,.55);color:var(--gold)}
.chips button.hl.on{background:var(--gold);color:#241a00;border-color:transparent;font-weight:700}

.evs{margin-top:9px;padding-top:8px;border-top:1px dashed var(--border);display:none}
.sw.open .evs{display:block}
.ev{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12.5px;min-width:0}
.ev .no{flex:0 0 auto;min-width:38px;font-size:10.5px;color:var(--dim)}
.ev .nm{flex:1;min-width:0;overflow-wrap:anywhere}

const PROG_BY_NO = new Map((DATA.program || []).map(p => [p.no, p]));
const ENTRIES  = DATA.entries  || [];
const RELAYS   = DATA.relays   || [];
const SWIMMERS = DATA.swimmers || [];

/* ---------- 文字の正規化（ひらがな・半角カナ・濁点をならす） ---------- */
function nk(s){
  if(!s) return "";
  let t = String(s).normalize("NFKC").normalize("NFD")
            .replace(/[゙゚]/g,"");          // 濁点・半濁点を落とす
  t = t.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60)); // ひらがな→カタカナ
  t = t.replace(/[ｧｨｩｪｫｬｭｮｯァィゥェォャュョッ]/g, c =>
        ({"ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ッ":"ツ"})[c] || c);
  return t.replace(/[\s　・ー\-]/g,"");
}
function nx(s){ return String(s||"").replace(/[\s　]/g,"").toLowerCase(); }

/* ---------- 表示ヘルパ ---------- */
const isX   = g => String(g||"").indexOf("混") >= 0;          // 混合（男女が一緒に泳ぐ種目）
const isF   = g => !isX(g) && String(g||"").indexOf("女") >= 0;
const gcls  = g => isX(g) ? "x" : isF(g) ? "f" : "m";
const gmark = g => isX(g) ? "🔵🔴 混合" : isF(g) ? "🔴 女子" : "🔵 男子";
const glabel= g => isX(g) ? "混合" : isF(g) ? "女子" : "男子";
const HLSET = new Set(META.highlightTeams || []);
const isHL  = t => HLSET.has(String(t||""));
const hlPill= t => isHL(t) ? `<span class="pill hl">⭐ ${esc(META.highlightLabel||"注目")}</span>` : "";
const esc   = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
                ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function shortGrade(g){
  return String(g||"").replace("中学","中").replace("高校","高").replace("小学","小").replace("大学","大");
}
function gradeNum(g){
  const s = String(g||""), n = (s.match(/(\d+)/)||[])[1];
  const base = s.indexOf("小")>=0 ? 0 : s.indexOf("中")>=0 ? 10 : s.indexOf("高")>=0 ? 20 : 30;
  return base + (n ? +n : 9);
}
function secOf(e){
  if(typeof e.sortTime === "number" && e.sortTime > 0) return e.sortTime;
  const t = String(e.time||"").trim();
  if(!t || /^(NT|なし|-)$/i.test(t)) return Infinity;
  const m = t.match(/^(?:(\d+):)?(\d+)\.(\d+)$/);
  return m ? (+(m[1]||0))*60 + (+m[2]) + (+("0."+m[3])) : Infinity;
}
// タイムが公表されない大会は 組→レーン（＝プログラム掲載順）で並べる。
const ordKey = e => META.noTimes ? ((e.heat||99)*100 + (e.lane||0)) : secOf(e);
const showTime = e => { const t=String(e.time||"").trim(); return (!t || /^(NT|なし)$/i.test(t)) ? "NT" : t; };
// 「NT」だけを並べても意味がないので、noTimes のときはタイム欄ごと出さない。
// 並び順の説明。タイムが無い大会は「組・レーン順（＝プログラム掲載順）」。
const ordLabel = () => META.noTimes ? "組・レーン順" : "エントリータイム順";
const tmTag = (e,tag,cls) => META.noTimes ? "" : `<${tag} class="${cls}">${esc(showTime(e))}</${tag}>`;

/* ---------- 競技結果（entries[].result / relays[].result があるときだけ） ---------- */
const MEDAL = {1:"🥇",2:"🥈",3:"🥉"};
/* リレーの泳者。泳ぐ順に並んでいるので「→」でつなぐ。 */
const memLine = x => (x && x.members && x.members.length)
  ? `<div class="mem"><span class="mh">泳順</span>${x.members.map(esc).join(" → ")}</div>` : "";
const rdOf = x => (PROG_BY_NO.get((x.programNos||[])[0]) || {}).round || "";
const isFinalA = x => /^決勝$|^タイム決勝$/.test(rdOf(x));
const isFinalB = x => /決勝/.test(rdOf(x)) && !isFinalA(x);
// B決勝は決勝の下位。B決勝1位でも、決勝に8人いるので総合9位。
const A_SIZE = new Map();
(()=>{ for(const p of PROGRAM){
    if(!/^決勝$|^タイム決勝$/.test(p.round||"")) continue;
    const n = ENTRIES.filter(e => (e.programNos||[]).includes(p.no)).length
            + RELAYS.filter(r => (r.programNos||[]).includes(p.no)).length;
    A_SIZE.set([p.gender,p.distance,p.stroke].join("|"), n || 8);
  } })();
const overallRank = x => {
  if(!isFinalB(x) || !x.result || !x.result.rank) return null;
  const p = PROG_BY_NO.get((x.programNos||[])[0]) || {};
  return x.result.rank + (A_SIZE.get([p.gender,p.distance,p.stroke].join("|")) ?? 8);
};
// メダルは決勝の1〜3位だけ。予選・B決勝には付けない。
const medalOf = x => isFinalA(x) ? (MEDAL[x.result && x.result.rank] || "") : "";
const ovPill  = x => { const n = overallRank(x); return n ? `<span class="pill ov">総合${n}位</span>` : ""; };
// 予選通過の印。result.adv に "決勝へ" 等の文字列（true なら「決勝へ」）を入れる。
const advPill = x => (x.result && x.result.adv) ? `<span class="pill adv">${esc(x.result.adv===true?"決勝へ":x.result.adv)}</span>` : "";
const hasRes  = l => l.some(e => e && e.result);
const resSec  = e => { const t=e.result&&e.result.time; if(!t) return Infinity;
  const m=t.match(/^(?:(\d+):)?(\d+)\.(\d+)$/); return m?(+(m[1]||0))*60+(+m[2])+(+("0."+m[3])):Infinity; };
const resKey  = e => e.result ? (e.result.rank || 9998) : 9999;
// 順位バッジ（1〜3位は色を変える）。棄権・失格は記録の代わりにその文字を出す。
// 新記録の印。★＋語（大会新・学生新…）。メダルは順位のものなので形も色も変える。
const recMk = e => (e.result && e.result.rec) ? `<span class="nrmk">★${esc(e.result.rec)}</span>` : "";
function resPill(e){
  const r = e.result; if(!r) return "";
  if(r.note) return `<span class="pill rk ng">${esc(r.note)}</span>`;
  const md = medalOf(e);
  return (r.rank ? `<span class="pill rk${r.rank===1&&isFinalA(e)?" m1":""}">${md}${r.rank}位</span>${ovPill(e)}${advPill(e)}` : "")
       + (r.time ? `<span class="rtime" style="margin-left:6px">${esc(r.time)}</span>` : "")
       + recMk(e);
}

/* ---------- 標準記録の突破判定（program[].standard があるときだけ） ---------- */
const PG_BY_NO = new Map(PROGRAM.map(p => [p.no, p]));
function stdOf(x){
  if(!META.standardLabel) return null;
  const p = PG_BY_NO.get(x.programNos?.[0]);
  const s = p && p.standard;
  if(!s) return null;
  const sec = (typeof s.sec === "number") ? s.sec : secOf({time:s.time});
  return (sec > 0 && isFinite(sec)) ? {time:s.time, sec:sec} : null;
}
const hitStd = x => { const s = stdOf(x); return !!s && secOf(x) <= s.sec + 1e-9; };

/* ---------- 校内順位（meta.schoolRank が true のときだけ） ----------
   同じ種目に同じ学校から出る選手を、エントリータイム順に並べた順位。   */
const SCHOOL_RANK = (()=>{
  const m = new Map();
  if(!META.schoolRank) return m;
  const grp = new Map();
  for(const e of ENTRIES){
    if(e.entryType === "リレーのみ") continue;
    const no = e.programNos?.[0]; if(no == null || !e.team) continue;
    const k = no + "|" + e.team;
    if(!grp.has(k)) grp.set(k, []);
    grp.get(k).push(e);
  }
  for(const list of grp.values()){
    list.sort((a,b)=> secOf(a)-secOf(b));
    list.forEach((e,i)=> m.set(e, {rank:i+1, n:list.length}));
  }
  return m;
})();

/* 種目の見出しに出す標準記録の案内 */
function stdHead(list){
  if(!META.standardLabel || !list.length) return "";
  const s = stdOf(list[0]);
  const note = META.standardNote ? `<br>${esc(META.standardNote)}` : "";
  if(!s) return note ? `<div class="note">${note.slice(4)}</div>` : "";
  const n = list.filter(hitStd).length;
  const u = list.every(e => e.isRelay || e.members) ? "チーム" : "名";
  return `<div class="note"><b>${esc(META.standardLabel)} ${esc(s.time)}</b>
    エントリータイムでの突破 <b>${n}${u}</b>（★突破）${note}</div>`;
}

/* エントリー行に付ける印（★標準突破 ／ 校内◯位） */
function tags(e){
  let h = "";
  if(hitStd(e)) h += `<span class="pill t">★突破</span>`;
  const r = SCHOOL_RANK.get(e);
  if(r) h += `<span class="pill r">校内${r.rank}位${r.n>1?"/"+r.n+"名":""}</span>`;
  if(e.note) h += `<span class="pill">${esc(e.note)}</span>`;
  return h;
}

/* ---------- 選手ごとにエントリーをまとめる ---------- */
const KEY = e => e.id || (nx(e.name) + "@" + nx(e.team));
const SW  = new Map();
for(const s of SWIMMERS){
  SW.set(s.id || (nx(s.name)+"@"+nx(s.team)),
        {id:s.id, name:s.name, kana:s.kana, team:s.team, grade:s.grade, gender:s.gender,
         origin:s.origin, originDetail:s.originDetail, evs:[]});
}
for(const e of ENTRIES){
  const k = KEY(e);
  if(!SW.has(k)) SW.set(k, {id:e.id, name:e.name, kana:e.kana, team:e.team, grade:e.grade, gender:e.gender, evs:[]});
  const o = SW.get(k);
  o.grade  = o.grade  || e.grade;
  o.gender = o.gender || e.gender;
  o.kana   = o.kana   || e.kana;
  o.team   = o.team   || e.team;
  if(e.entryType === "リレーのみ") o.relayOnly = true;   // 個人種目は持たない
  else o.evs.push(e);
}
const SWL = [...SW.values()].filter(s => s.evs.length || s.name);
for(const s of SWL){
  s._n = nx(s.name); s._k = nk(s.kana) + nk(s.name); s._t = nx(s.team);
  s.evs.sort((a,b)=> (a.programNos?.[0]||999) - (b.programNos?.[0]||999));
}

/* ---------- チーム一覧 ---------- */
const TEAMS = (()=>{
  const m = new Map();
  for(const s of SWL){ if(!s.team) continue; m.set(s.team, (m.get(s.team)||0)+1); }
  return [...m.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0],"ja"));
})();

/* ---------- チームの並び順 ----------
   meta.highlightTeams に書いた順を先頭に、あとは TEAMS（人数の多い順）に従う。
   同じ学校の選手が名簿でばらけないように、選手タブの並びの第1キーに使う。 */
const TEAM_ORDER = (()=>{
  const m = new Map();
  (META.highlightTeams||[]).forEach((t,i)=> m.set(t, i));
  TEAMS.forEach((t,i)=>{ if(!m.has(t[0])) m.set(t[0], 1000+i); });
  return m;
})();
const teamRank = t => TEAM_ORDER.has(t) ? TEAM_ORDER.get(t) : 9999;

/* ---------- 種目グループ ---------- */
const EVENTS = (()=>{
  const m = new Map();
  for(const e of ENTRIES){
    if(e.entryType === "リレーのみ") continue;
    const ev = e.event || ((e.distance||"") + " " + (e.stroke||"")).trim();
    // 予選・B決勝・決勝は別のレース。競技No.ごとに分ける
    // （まとめると No.9〜20 のような決勝が一覧から消える。2026-09-03に実害）
    const no = e.programNos?.[0];
    const rd = (PROG_BY_NO.get(no)||{}).round || "";
    const k  = glabel(e.gender) + " " + ev + (rd && rd !== "予選" ? " " + rd : "");
    if(!m.has(k)) m.set(k, {key:k, gender:e.gender, event:ev, round:rd, list:[]});
    m.get(k).list.push(e);
  }
  for(const g of m.values()){
    g.list.sort((a,b)=> ordKey(a)-ordKey(b));
    g.no = Math.min(...g.list.map(e => e.programNos?.[0] ?? 9999));   // 競技順に並べる
  }
  return [...m.values()].sort((a,b)=> a.no - b.no);
})();

/* ---------- レース（＝同じ組で一緒に泳ぐ単位） ----------
   program[] に race を書くと、同じ値の競技No.をまとめて1レースとして組を作る。
   （例: 学年区分が分かれていても「4年生以下」で合同で泳ぐ大会）
   race を書かなければ 競技No.1本＝1レース＝従来どおり。            */
const RACES = (()=>{
  const m = new Map();
  for(const p of PROGRAM){
    const k = (p.race != null) ? "r:"+p.race : "n:"+p.no;
    if(!m.has(k)) m.set(k, {key:k, nos:[], label:p.raceLabel||"", gender:p.gender, day:p.day,
                            round:p.round, distance:p.distance, stroke:p.stroke, classes:[]});
    const r = m.get(k);
    r.nos.push(p.no);
    const cs = Array.isArray(p.classes) ? p.classes : (p.classGrade ? [p.classGrade] : []);
    for(const c of cs) if(!r.classes.includes(c)) r.classes.push(c);
    if(p.classGrade && !r.label) r.label = p.classGrade;
    if(isF(p.gender) !== isF(r.gender)) r.mixGender = true;
  }
  return [...m.values()];
})();
const EV_BY_NO = new Map();
const RACE_BY_NO = new Map();
for(const r of RACES) for(const no of r.nos) RACE_BY_NO.set(no, r);
const raceEvent = r => ((r.distance||"")+" "+(r.stroke||"")).trim();
const raceMark  = r => r.mixGender ? "🔵🔴 男女" : gmark(r.gender);
/* そのレースを一緒に泳ぐ人（個人＋リレー）*/
function raceList(r){
  const hit = x => (x.programNos||[]).some(n => r.nos.includes(n));
  const ind = ENTRIES.filter(e => e.entryType !== "リレーのみ" && hit(e));
  const rel = RELAYS.filter(hit).map(x => Object.assign({}, x, {name:x.team, team:"", isRelay:true}));
  return ind.concat(rel);
}

/* ---------- 組・レーン計算 ----------
   ルール：全体をタイム順に並べ、遅い方から切って第1組＝最遅。
          組内は速い順に中央から外へ（10レーンなら 4→5→3→6→2→7→1→8→0→9）。
          端数が1人になる場合だけ 3 + (L-2) に振り替える。          */
function laneOrder(lanes){
  const n = lanes.length, mid = Math.floor((n-1)/2), out = [lanes[mid]];
  let l = mid-1, r = mid+1;
  while(out.length < n){
    if(r < n) out.push(lanes[r++]);
    if(out.length < n && l >= 0) out.push(lanes[l--]);
  }
  return out;
}
function heatSizes(n, L){
  if(n <= 0) return [];
  const H = Math.ceil(n/L), sizes = new Array(H).fill(L);
  let r = n % L; if(r === 0) r = L;
  sizes[0] = r;                                        // 第1組（最遅）が端数
  if(sizes[0] === 1 && H >= 2){ sizes[0] = 3; sizes[1] = L-2; }
  return sizes;
}
function buildHeats(list){
  const order = laneOrder(LANES), L = LANES.length;
  const slow  = list.slice().sort((a,b)=> secOf(b)-secOf(a));   // 遅い順
  const sizes = heatSizes(slow.length, L), heats = [];
  let i = 0;
  for(const size of sizes){
    const grp  = slow.slice(i, i+size).sort((a,b)=> secOf(a)-secOf(b)); // 組内は速い順
    const seat = new Map();
    grp.forEach((e,idx)=> seat.set(order[idx], e));
    heats.push({n:grp.length, seat});
    i += size;
  }
  return heats;
}

/* 押せる div（カード・種目行）に、キーボードと読み上げのための印を付ける。
   見た目も指での操作も変わらない。 */
function tappable(el, label){
  if(!el) return;
  if(el.tagName === "BUTTON" || (el.tagName === "A" && el.hasAttribute("href"))) return;
  el.setAttribute("role", "button");
  el.setAttribute("tabindex", "0");
  if(label && !el.hasAttribute("aria-label")) el.setAttribute("aria-label", label);
}
document.addEventListener("keydown", ev => {
  // 端末やIMEによって key が空で届くことがあるので code / keyCode でも見る
  const hit = ev.key === "Enter" || ev.key === " " || ev.key === "Spacebar"
           || ev.code === "Enter" || ev.code === "NumpadEnter" || ev.code === "Space"
           || ev.keyCode === 13 || ev.keyCode === 32;
  if(!hit) return;
  const t = ev.target;
  if(t && t.tagName !== "BUTTON" && t.getAttribute && t.getAttribute("role") === "button"){
    ev.preventDefault(); t.click();
  }
});

/* ---------- 応援モード ----------
   応援は下の名前で呼ぶ。他校の子の漢字が読めなくても声が出せるように、
   行の📣でその子の「下の名前のひらがな」だけを画面いっぱいに出す。
   描画のたびに CH_ROWS を作り直し、行の data-ch にその番号を持たせる。
   同じ一覧（同じ g）の行を ◀ ▶ で順に送れる（組・レーンなら組→レーン順）。 */
const CH_ROWS = [];
let CH_I = null, CH_PUSHED = false;
const toHira = s => String(s||"").normalize("NFKC")
  .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const kanaOf = x => x.kana || (SW.get(KEY(x)) || {}).kana || "";
const chKey  = x => "chk:" + nx(x.name) + "@" + nx(x.team);
const chGet  = x => { try{ return localStorage.getItem(chKey(x)) || ""; }catch(_){ return ""; } };
const chSet  = (x, v) => { try{ v ? localStorage.setItem(chKey(x), v) : localStorage.removeItem(chKey(x)); }catch(_){} };
/* 姓と名を分ける。カナも漢字も「姓 名」の空白区切りが前提。
   区切りが無いカナはそのまま全部を出す（分けられないものを勝手に切らない）。 */
function nameParts(x){
  const sp = /[\s　]+/;
  const np = String(x.name||"").trim().split(sp).filter(Boolean);
  const kp = toHira(kanaOf(x)).trim().split(sp).filter(Boolean);
  const o = {sei: np.length>1 ? np[0] : "", mei: np.length>1 ? np.slice(1).join("") : np.join(""),
             seiK: kp.length>1 ? kp[0] : "", meiK: kp.length>1 ? kp.slice(1).join("") : (kp[0]||""),
             split: kp.length>1, hasKana: kp.length>0};
  const fix = chGet(x);
  if(fix){ o.meiK = fix; o.fixed = true; o.split = true; }
  return o;
}
function chBtn(x, g, extra){
  if(!x || x.isRelay || !x.name) return "";
  const i = CH_ROWS.push(Object.assign({g}, extra||{},
    {name:x.name, kana:kanaOf(x), team:x.team, grade:x.grade, gender:x.gender})) - 1;
  return `<button class="chb" data-ch="${i}" aria-label="名前をひらがなで大きく表示（応援用）"><span>📣</span><small>応援</small></button>`;
}
/* 直前に chBtn を呼んだ行の番号（行全体タップ用） */
const chLast = () => CH_ROWS.length - 1;
function chGroup(i){ const g = CH_ROWS[i].g; return CH_ROWS.map((r,j)=> r.g===g ? j : -1).filter(j => j>=0); }
/* 名前を k 行に分ける。「ょ」「っ」「ー」が行頭に来ないように、直前の行に付ける。 */
const CH_SMALL = /[ぁぃぅぇぉゃゅょっゎー]/;
function chLines(s, k){
  const cs = [...s]; if(k <= 1 || cs.length <= k) return s;
  const out = []; let i = 0;
  for(let li = 0; li < k && i < cs.length; li++){
    let take = Math.ceil((cs.length - i) / (k - li));
    while(i + take < cs.length && CH_SMALL.test(cs[i + take])) take++;
    out.push(cs.slice(i, i + take).join("")); i += take;
  }
  return out.join("\n");
}
/* 1行・2行・3行で試して、いちばん大きく出せる分け方を選ぶ。
   行を増やすのは文字が 1.3 倍以上大きくなるときだけ（3文字を無理に2行にしない）。 */
function chFit(){
  const mid = document.getElementById("chMid"), el = document.getElementById("chMei");
  const others = ["chSei","chKj","chTm"].reduce((a,id)=> a + document.getElementById(id).offsetHeight, 0);
  const W = mid.clientWidth - 16, H = Math.max(60, mid.clientHeight - others - 24);
  const raw = el.dataset.raw || "", n = [...raw].length;
  // 横書き1〜4行に加えて、縦書き1列（短い名前は縦に積むと画面いっぱいになる）
  const cands = (n <= 3 ? [1] : n <= 6 ? [1,2,3] : [1,2,3,4]).map(k => ({k, v:false}));
  if(n <= 6) cands.push({k:1, v:true});
  let best = null;
  el.style.whiteSpace = "pre";
  for(const c of cands){
    const t = chLines(raw, c.k); el.textContent = t;
    el.style.writingMode = c.v ? "vertical-rl" : "horizontal-tb";
    let lo = 18, hi = 520;
    for(let j = 0; j < 14; j++){
      const m = (lo + hi) / 2; el.style.fontSize = m + "px";
      if(el.scrollWidth <= W && el.scrollHeight <= H) lo = m; else hi = m;
    }
    if(!best || lo >= best.size * 1.3) best = {size:lo, text:t, v:c.v};
  }
  el.textContent = best.text;
  el.style.writingMode = best.v ? "vertical-rl" : "horizontal-tb";
  el.style.fontSize = Math.floor(best.size) + "px";
}
function chDraw(){
  const r = CH_ROWS[CH_I]; if(!r) return;
  const o = nameParts(r), ov = document.getElementById("ch");
  ov.classList.toggle("f", isF(r.gender));
  const ev = r.evLabel ? esc(r.evLabel) : "";
  const where = r.heat ? `第${r.heat}組 ${r.lane}レーン` : "";
  document.getElementById("chEv").innerHTML = [ev, where].filter(Boolean).join("　");
  document.getElementById("chSei").textContent = o.split ? o.seiK : (o.hasKana ? "" : o.sei);
  document.getElementById("chMei").dataset.raw = o.hasKana ? o.meiK : (o.mei || r.name);
  document.getElementById("chKj").textContent  = r.name;
  document.getElementById("chTm").textContent  = [r.team, shortGrade(r.grade)].filter(Boolean).join("　");
  const note = !o.hasKana ? "読みのデータがありません。「読みを直す」で入れられます"
             : o.fixed ? "✎ この端末で直した読みです"
             : !o.split ? "姓と名の区切りが無いので、続けて出しています"
             : (META.showKana ? "" : "読みは推定です。違っていたら「読みを直す」で直せます");
  document.getElementById("chNote").textContent = note;
  const grp = chGroup(CH_I), pos = grp.indexOf(CH_I);
  const lab = (j, arrow) => { if(j == null) return ""; const q = CH_ROWS[j], qo = nameParts(q);
    const nm = qo.hasKana ? qo.meiK : (qo.mei || q.name);
    return arrow < 0 ? `◀ ${esc(nm)}<b>${q.lane!=null?`第${q.heat}組 ${q.lane}レーン`:"前の子"}</b>`
                     : `${esc(nm)} ▶<b>${q.lane!=null?`第${q.heat}組 ${q.lane}レーン`:"次の子"}</b>`; };
  const pv = document.getElementById("chPv"), nx_ = document.getElementById("chNx");
  pv.innerHTML = lab(grp[pos-1], -1) || "◀"; pv.disabled = pos <= 0; pv.dataset.to = grp[pos-1] ?? "";
  nx_.innerHTML = lab(grp[pos+1], 1) || "▶"; nx_.disabled = pos >= grp.length-1; nx_.dataset.to = grp[pos+1] ?? "";
  ov.classList.add("show"); document.body.classList.add("chon");
  chFit();
}
function chOpen(i){
  if(!CH_ROWS[i]) return;
  CH_I = i;
  if(!CH_PUSHED){ try{ history.pushState({ch:1}, ""); CH_PUSHED = true; }catch(_){ CH_PUSHED = false; } }
  chDraw();
}
function chClose(fromPop){
  CH_I = null;
  document.getElementById("ch").classList.remove("show"); document.body.classList.remove("chon");
  if(CH_PUSHED && !fromPop){ CH_PUSHED = false; try{ history.back(); }catch(_){} }
  else CH_PUSHED = false;
}
window.addEventListener("popstate", () => { if(CH_I != null) chClose(true); });
window.addEventListener("resize", () => { if(CH_I != null) chFit(); });
document.getElementById("chX").onclick = () => chClose(false);
document.getElementById("chPv").onclick = e => { const t = e.currentTarget.dataset.to; if(t !== "") { CH_I = +t; chDraw(); } };
document.getElementById("chNx").onclick = e => { const t = e.currentTarget.dataset.to; if(t !== "") { CH_I = +t; chDraw(); } };
document.getElementById("chEd").onclick = () => {
  const r = CH_ROWS[CH_I]; if(!r) return;
  const o = nameParts(r);
  const v = prompt("下の名前の読み（ひらがな）\n空にすると元に戻します", o.hasKana ? o.meiK : "");
  if(v === null) return;
  chSet(r, toHira(v).replace(/[\s　]+/g, ""));
  chDraw();
};
document.addEventListener("keydown", ev => { if(ev.key === "Escape" && CH_I != null) chClose(false); });
/* 左右スワイプで隣の子へ */
(() => { let sx = null, sy = null;
  const mid = document.getElementById("chMid");
  mid.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  mid.addEventListener("touchend", e => {
    if(sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = sy = null;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    (dx < 0 ? document.getElementById("chNx") : document.getElementById("chPv")).click();
  }, {passive:true});
})();

const M = document.getElementById("main");

function render(){
  [...tabsEl.children].forEach(b => {
    const on = !ST.pt && b.dataset.t === ST.tab;
    b.classList.toggle("on", on);

  drawPbar();
  bind();
  window.scrollTo(0,0);
}

/* ---------- 選手カード ---------- */
function swCard(s, i, noTeamPill){
  const g = gcls(s.gender);
  const kn = (META.showKana && s.kana) ? `<span class="sw-kn">${esc(s.kana)}</span>` : "";
  const open = ST.open.has(KEY(s.evs[0]||s)) ? " open" : "";
  // 種目行タップで組・レーンへジャンプ（そのレースが RACE_BY_NO にあるときだけ）
  const jn = e => (META.lanePrediction!==false && e.programNos?.length) ? ` data-jn="${e.programNos[0]}" style="cursor:pointer"` : "";
  // 申込タイムが無い大会は、代わりに日程表の開始予定時刻を出す（何時に招集所へ行くかが本題なので）
  const stm = e => { const p = PG_BY_NO.get(e.programNos?.[0]);
    if(!(p && p.startTime)) return "";
    // 時刻だけだと「何日目の話か」が分からない。meta.dayDates があれば 9/11、無ければ 1日目 を上に出す。
    const d = p.day ? ((META.dayDates||{})[p.day] || p.day) : "";
    return `<span class="tm" style="color:var(--gold)">${d?`<span class="evd">${esc(d)}</span>`:""}${esc(p.startTime)}</span>`; };
  // 何時ごろ泳ぐか（日程表に時刻があるときだけ）。結果が出た種目には出さない。
  const clkLine = e => { if(e.result) return ""; const c = clockOf(e); if(!c) return "";
    return `<span class="clk">⏰ ${clockText(c)}<span class="dim">　第${c.heat}組・${c.lane}レーン${META.laneConfirmed?"":"（予想）"}</span></span>`; };
  const evRow = e => `<div class="ev"${jn(e)}>
      <span class="no">${e.programNos?.length ? "No."+e.programNos.join("/") : ""}</span>
      <span class="nm">${esc(e.event || ((e.distance||"")+" "+(e.stroke||"")))}${tags(e)}${clkLine(e)}</span>
      ${e.result ? `<span class="tm">${resPill(e)}</span>` : (tmTag(e,"span","tm") || stm(e))}</div>`;
  // 個人種目が無い選手＝リレーで出場する選手。何も出さないと「情報が抜けている」と読まれるので、
  // 所属校が申し込んだリレー種目を出す（泳者4名と泳順は当日決まる）。
  const rl = s.evs.length ? [] : RELAYS.filter(r => r.team === s.team && isF(r.gender) === isF(s.gender))
                                       .sort((a,b) => (a.programNos?.[0]||999) - (b.programNos?.[0]||999));
  const evs = s.evs.length
    ? s.evs.map(evRow).join("")
    : (rl.length ? `<div class="rlhd">🏊 リレーで出場 <span class="dim">（泳者は当日発表）</span></div>`
                 + rl.map(evRow).join("") : "");
  // 応援カードの見出しにその子の種目を短く出す
  const clks = s.evs.filter(e => !e.result).map(clockOf).filter(Boolean);
  const clkSum = clks.length ? `<span class="pill clk">⏰ ${clks.map(c => fmtm(c.t)).join("・")}</span>` : "";
  const chb = chBtn(s, "sw", {evLabel: s.evs.map(e => (e.programNos?.length ? "No."+e.programNos[0]+" " : "") + (e.event || ((e.distance||"")+" "+(e.stroke||"")))).join(" ／ ")});
  return `<div class="sw ${g}${open}${isMk(s)?" hl":""}${chb?" hasch":""}" data-k="${esc(KEY(s.evs[0]||s))}">${chb}
    <div class="sw-r1">
      <span class="sw-nm">${esc(s.name)}</span>${kn}
      ${s.evs.length ? `<span class="sw-bd">${s.evs.length}種目</span>` : `<span class="sw-bd">リレー</span>`}
    </div>
    <div class="sw-r2">
      <span class="sw-tm">${esc(s.team)}</span>${noTeamPill ? "" : mkPill(s)}
      ${s.grade ? `<span class="pill">${esc(shortGrade(s.grade))}</span>` : ""}
      <span class="pill ${g}">${isF(s.gender)?"女子":"男子"}</span>${clkSum}
    </div>
    ${evs ? `<div class="evs">${evs}</div>` : ""}
  </div>`;
}

/* ブロックの中身。学校がまとまって見えるよう、2校以上でまとまりがあるときは学校ごとに小見出しを付ける。
   （1人ずつバラバラの検索結果では小見出しを出さない） */
function teamGroups(list){
  const teams = [...new Set(list.map(s => s.team))];
  if(teams.length < 2 || list.length < teams.length * 2) return list.map(s => swCard(s)).join("");
  return teams.map(t => {
    const g = list.filter(s => s.team === t);
    return `<div class="tsec">${esc(t)}${hlPill(t)}<span class="n">${g.length}名</span></div>`
         + g.map(x => swCard(x, 0, true)).join("");
  }).join("");
}

/* 男女ブロックに分けて出す */
function genderBlocks(list, sortFn){
  const m = list.filter(s => !isF(s.gender)).sort(sortFn);
  const f = list.filter(s =>  isF(s.gender)).sort(sortFn);
  let h = "";
  if(m.length) h += `<div class="gsec m">🔵 男子<span class="n">${m.length}名</span></div>` + teamGroups(m);
  if(f.length) h += `<div class="gsec f">🔴 女子<span class="n">${f.length}名</span></div>` + teamGroups(f);
  return h;
}

/* ---------- 学校対抗得点（data.teamPoints があるときだけ） ---------- */
const TP = DATA.teamPoints || null;
const tpG = () => (TP && TP.genders && TP.genders[ST.ptG]) || null;

function viewPoints(){
  const g = tpG(); if(!g) return "";
  const segs = TP.genders.map((x,i)=>
    `<button data-ptg="${i}" class="${i===ST.ptG?"on":""}${isF(x.gender)?" f":""}">${gmark(x.gender)}</button>`).join("");
  const inRace = g.teams.filter(t => t.rank);       // 学校対抗の対象校（団体出場校・シード校）
  const outRace = g.teams.filter(t => !t.rank);     // 個人出場校＝得点しても対象外
  const top = inRace[0] ? inRace[0].points : 0;
  const row = t => {
    const last = t.gains.length ? t.gains[t.gains.length-1] : null;
    const diff = t.rank === 1 || !t.points ? "" : `<span>${(t.points-top).toFixed(1).replace(/\.0$/,"")}</span>`;
    return `<div class="pt ${isF(g.gender)?"f":"m"}${isHL(t.team)?" hl":""}">
        <span class="rk${t.rank===1?" m1":""}${t.rank?"":" no"}">${t.rank || "-"}</span>
        <span class="nm">${t.seed?`<span class="st">★</span>`:""}${esc(t.team)}${hlPill(t.team)}</span>
        <span class="pv"><b>${String(t.points).replace(/\.0$/,"")}</b>${diff}</span>
      </div>` + (last && last.gain ? `<div class="pt-gain">${esc(last.ev)} で +${String(last.gain).replace(/\.0$/,"")}</div>` : "");
  };
  const rows = inRace.map(row).join("")
    + (outRace.length ? `<div class="gsec" style="margin-top:18px">学校対抗の対象外<span class="n">${outRace.length}校</span></div>`
        + `<div class="pt-note" style="margin-bottom:8px">団体出場校ではないため、得点しても学校対抗の順位には入りません。</div>`
        + outRace.map(row).join("") : "");
  const rest = g.events.length - g.eventsDone;
  return `<div class="pt-seg">${segs}</div>
    <div class="count">🏆 <b>${g.eventsDone}</b>/${g.events.length}種目 終了</div>
    <div class="pt-note">入賞（8位以内）した学校だけに点が入ります。
      <b>リレーは個人の2倍</b>（決勝1位 40点／個人は20点）。
      ${rest>0?`残り<b>${rest}種目</b>あるので、まだ大きく動きます。`:"全種目が終わりました。"}<br>
      ★は<b>シード校</b>（前年度8位以内）。順位が付くのは<b>シード校と団体出場校</b>だけです。</div>
    ${rows}
    ${TP.note?`<div class="note" style="margin-top:14px">${md(TP.note)}</div>`:""}`;
}

/* ---------- タブ1：選手・チーム ---------- */
function viewSw(){
  const c = S.counts || {};
  const stats = [
    [c.swimmers ?? SWL.length, "選手数"],
    [c.individualEntries ?? ENTRIES.length, "個人申込"],
    [c.relayEntries ?? RELAYS.length, "リレー申込"],
    [c.schoolsAndTeams ?? TEAMS.length, "チーム"],
    [c.programItems ?? PROGRAM.length, "プログラム"]
  ].filter(x => x[0]).map(x => `<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");

  const q = nx(ST.q), qk = nk(ST.q);
  let list = SWL;
  if(ST.hl) list = list.filter(s => isMk(s));
  if(ST.gender !== "all") list = list.filter(s => (ST.gender==="f") === isF(s.gender));
  if(q) list = list.filter(s => s._n.includes(q) || s._t.includes(q) || (qk && s._k.includes(qk)));

  // ⭐のチームを日ごとに追う一覧（当日「うちの県は今日だれが何時に泳ぐか」を一目で）
  const days = [...new Set(PROGRAM.map(p=>p.day).filter(Boolean))];
  const hlSeg = (ST.hl && days.length > 1)
    ? `<div class="seg"><button data-hd="all" class="${ST.hlDay==="all"?"on":""}">名簿</button>` +
      days.map(d=>`<button data-hd="${esc(d)}" class="${ST.hlDay===d?"on":""}">${esc(d)}</button>`).join("") + `</div>`
    : "";
  const hlTimeline = () => {
    const rows = [];
    for(const e of ENTRIES) if(isHL(e.team) && e.entryType !== "リレーのみ") rows.push(e);
    for(const r of RELAYS)  if(isHL(r.team)) rows.push(Object.assign({}, r, {name:r.team + " リレー", isRelay:true}));
    const dayRows = rows.filter(x => (PG_BY_NO.get(x.programNos?.[0])||{}).day === ST.hlDay
                                  && (ST.gender==="all" || (ST.gender==="f") === isF(x.gender)))
      .sort((a,b)=> (a.programNos[0]-b.programNos[0]) || ((a.heat||0)-(b.heat||0)) || ((a.lane||0)-(b.lane||0)));
    if(!dayRows.length) return `<div class="empty"><span class="e">🫧</span>${esc(ST.hlDay)}に${esc(META.highlightLabel||"注目")}の出場はありません</div>`;
    return `<div class="count">⭐ ${esc(META.highlightLabel||"注目")}・${esc(ST.hlDay)}・<b>${dayRows.length}</b>レース（時間順）</div>` +
      dayRows.map(x => { const p = PG_BY_NO.get(x.programNos[0]) || {};
        return `<div class="sw ${gcls(x.gender)} hl" data-jn="${x.programNos[0]}" style="cursor:pointer">
          <div class="sw-r1"><span class="sw-nm">${esc(x.name)}</span>
            ${x.result ? `<span class="tm">${resPill(x)}</span>` : `<span class="sw-bd" style="color:var(--gold)">${esc(p.startTime||"")}</span>`}</div>
          <div class="sw-r2"><span class="sw-tm">No.${x.programNos[0]} ${esc((p.distance||"")+" "+(p.stroke||""))} ${esc(p.round||"")}</span>
            ${x.note?`<span class="pill">${esc(x.note)}</span>`:""}${x.result&&p.startTime?`<span class="pill">${esc(p.startTime)}</span>`:""}
            <span class="pill ${gcls(x.gender)}">${isF(x.gender)?"女子":"男子"}</span></div>${memLine(x)}</div>`; }).join("");
  };
  const body = (ST.hl && ST.hlDay !== "all")
    ? hlTimeline()
    : !ST.q && ST.gender==="all" && !ST.hl
    ? `<div class="empty"><span class="e">🔍</span>選手名（ひらがなでも可）や<br>チーム名を入れてください<br>下のチップをタップしても出ます</div>`
    : list.length
      ? `<div class="count"><b>${list.length}</b>名が該当</div>` +
        genderBlocks(list, (a,b)=> teamRank(a.team)-teamRank(b.team)
                                || gradeNum(a.grade)-gradeNum(b.grade)
                                || a.name.localeCompare(b.name,"ja"))
      : `<div class="empty"><span class="e">🫧</span>該当する選手が見つかりません</div>`;

  return `<div class="stats">${stats}</div>
    ${META.notice ? `<div class="note">${md(META.notice)}</div>` : ""}
    <div class="seg">
      <button data-g="all" class="${ST.gender==="all"?"on":""}">全員</button>
      <button data-g="m" class="${ST.gender==="m"?"on m":""}">🔵 男子</button>
      <button data-g="f" class="${ST.gender==="f"?"on f":""}">🔴 女子</button>
    </div>
    <div class="field">
      <input id="q" type="text" value="${esc(ST.q)}" placeholder="名前・ひらがな・チーム名で検索" aria-label="選手名・ひらがな・チーム名で検索">
      <button id="qc">クリア</button>
    </div>
    <div class="chips">${HLSET.size?`<button class="hl${ST.hl?" on":""}" data-hl="1">⭐ ${esc(META.highlightLabel||"注目")} ${SWL.filter(s=>isMk(s)).length}名</button>`:""}${TEAMS.map(t=>`<button data-tm="${esc(t[0])}">${esc(t[0])} ${t[1]}</button>`).join("")}</div>
    ${hlSeg}
    ${body}`;
}

/* ---------- タブ2：種目 ---------- */
function viewEv(){
  const g = EVENTS[ST.ev];
  const opts = EVENTS.map((e,i)=>`<option value="${i}" ${i===ST.ev?"selected":""}>No.${e.no} ${esc(e.key)}（${e.list.length}名）</option>`).join("");
  if(!g) return `<div class="empty"><span class="e">🏊</span>種目データがありません</div>`;
  const done = hasRes(g.list);
  const list = done ? [...g.list].sort((a,b)=> resKey(a)-resKey(b) || resSec(a)-resSec(b)) : g.list;
  const rows = list.map((e,i)=>{ const chb = chBtn(e, "ev", {evLabel:"No."+g.no+" "+g.key});
    return `<div class="sw ${gcls(e.gender)}${isMk(e)?" hl":""}${chb?" hasch":""}"${chb?` data-chrow="${chLast()}"`:""}>${chb}
      <div class="sw-r1">
        ${done
          ? (e.result && e.result.rank
              ? `<span class="rkno${e.result.rank===1&&isFinalA(e)?" m1":""}">${medalOf(e)||e.result.rank}</span>`
              : `<span class="rkno" style="background:rgba(140,155,185,.14);color:var(--muted)">-</span>`)
          : `<span class="sw-bd" style="margin:0 6px 0 0;background:rgba(255,204,102,.13);color:var(--gold)">${i+1}</span>`}
        <span class="sw-nm">${esc(e.name)}</span>
        ${done
          ? (e.result && e.result.note ? `<span class="sw-bd">${esc(e.result.note)}</span>`
             : e.result && e.result.time ? `<span class="sw-bd" style="color:var(--gold)">${esc(e.result.time)}</span>${recMk(e)}` : "")
          : tmTag(e,"span","sw-bd")}
      </div>
      <div class="sw-r2">
        <span class="sw-tm">${esc(e.team)}</span>${mkPill(e)}
        ${e.grade?`<span class="pill">${esc(shortGrade(e.grade))}</span>`:""}
        <span class="pill ${gcls(e.gender)}">${isF(e.gender)?"女子":"男子"}</span>
        ${ovPill(e)}${advPill(e)}${done ? "" : (c => c ? `<span class="pill clk">⏰ ${clockText(c)} 第${c.heat}組</span>` : "")(clockOf(e))}
        ${done && e.time ? `<span class="pill ent">申込 ${esc(e.time)}</span>` : ""}
        ${tags(e)}
      </div></div>`; }).join("");
  return `<select id="evSel" aria-label="種目を選択">${opts}</select>
    ${stdHead(g.list)}
    <div class="count">${done ? "🏁 結果・<b>"+g.list.length+"</b>名" : ordLabel()+"・<b>"+g.list.length+"</b>名"}</div>${rows}`;
}

/* ---------- タブ3：日程（プログラム） ---------- */
function viewPg(){
  const days = [...new Set(PROGRAM.map(p=>p.day).filter(Boolean))];
  const segs = days.length>1
    ? `<div class="seg"><button data-d="all" class="${ST.day==="all"?"on":""}">${days.length>2?"全日":"両日"}</button>` +
      days.map(d=>`<button data-d="${esc(d)}" class="${ST.day===d?"on":""}">${esc(d)}</button>`).join("") + `</div>`
    : "";
  let pg = PROGRAM;
  if(ST.day !== "all") pg = pg.filter(p => p.day === ST.day);

  if(ST.pgNo != null){
    const p = PROGRAM.find(x => x.no === ST.pgNo);
    const list0 = ENTRIES.filter(e => (e.programNos||[]).includes(ST.pgNo))
      .concat(RELAYS.filter(r => (r.programNos||[]).includes(ST.pgNo))
                    .map(r => Object.assign({}, r, {name:r.team, team:"", isRelay:true})))
      .sort((a,b)=> secOf(a)-secOf(b));
    // 結果が出たら順位順に並べ替える（申込タイム順のままだと1位が真ん中に来て読めない）
    const done = hasRes(list0);
    const list = done ? [...list0].sort((a,b)=> resKey(a)-resKey(b) || resSec(a)-resSec(b)) : list0;
    const unit = list.length && list.every(e => e.isRelay) ? "チーム" : "名";
    const rc = RACE_BY_NO.get(ST.pgNo);
    const together = (rc && (rc.nos.length > 1 || rc.classes.length > 1))
      ? `<div class="note">このレースは <b>${esc(rc.classes.join("・"))}</b>が<b>一緒に泳ぎます</b>${rc.nos.length>1?`（No.${rc.nos.join("・")}）`:""}。
          順位・賞状は<b>学年区分ごと</b>なので、同じ組の着順とは一致しません。</div>`
      : "";
    // 前後の種目へ一覧に戻らず移れるように（当日は次々に追いかけるので）。上下に同じボタンを置く
    const idx = PROGRAM.findIndex(x => x.no === ST.pgNo);
    const pv = PROGRAM[idx - 1], nx = PROGRAM[idx + 1];
    const short = x => `No.${x.no} ${isF(x.gender)?"女":"男"} ${esc((x.distance||"")+(x.stroke||"").replace("メドレーリレー","MR").replace("フリーリレー","FR").replace("個人メドレー","IM").replace("バタフライ","バタ").replace("平泳ぎ","平").replace("背泳ぎ","背").replace("自由形","自"))}${x.classGrade?" "+esc(x.classGrade.replace("年生",""))  :""}`;
    const nb = (x, id, dir) => x ? `<button class="tab pgnav ${gcls(x.gender)}" data-go="${id}" style="min-height:52px;flex:1;min-width:0;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);font-size:12px;white-space:normal;line-height:1.3">${dir<0?"◀ ":""}${short(x)}${dir>0?" ▶":""}</button>`
                               : `<span style="flex:1"></span>`;
    const nav = `<div style="display:flex;gap:8px;margin:0 0 10px">${nb(pv,-1,-1)}${nb(nx,1,1)}</div>`;
    return `<button class="tab" id="back" style="min-height:48px;width:100%;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);margin-bottom:10px">← プログラム一覧へ戻る</button>
      ${nav}
      ${pgHead(p)}
      ${together}
      ${META.lanePrediction ? `<button class="tab" id="toLn" style="min-height:48px;width:100%;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);margin-bottom:10px">🏁 この種目の組・レーンを見る</button>` : ""}
      ${p&&p.note?`<div class="note">${md(p.note)}</div>`:""}
      ${stdHead(list)}
      ${list.length?`<div class="count">${done ? "🏁 結果" : ordLabel()}・<b>${list.length}</b>${unit}</div>`:""}
      ${list.map(e=>{ const chb = chBtn(e, "pg", {evLabel: p ? `No.${p.no} ${glabel(p.gender)} ${(p.distance||"")+" "+(p.stroke||"")} ${p.round||""}`.trim() : ""});
        return `<div class="sw ${gcls(e.gender)}${isMk(e)?" hl":""}${chb?" hasch":""}"${chb?` data-chrow="${chLast()}"`:""}>${chb}
        <div class="sw-r1"><span class="sw-nm">${esc(e.name)}</span>${
          e.result ? `<span class="sw-bd" style="color:var(--gold)">${esc(e.result.time || e.result.note || "")}</span>${recMk(e)}`
                   : tmTag(e,"span","sw-bd")}</div>
        <div class="sw-r2">${e.team?`<span class="sw-tm">${esc(e.team)}</span>`:""}${mkPill(e)}
          ${e.grade?`<span class="pill">${esc(shortGrade(e.grade))}</span>`:""}
          <span class="pill ${gcls(e.gender)}">${isF(e.gender)?"女子":"男子"}</span>
          ${e.result&&e.result.rank?`<span class="pill rk${e.result.rank===1&&isFinalA(e)?" m1":""}">${medalOf(e)}${e.result.rank}位</span>${ovPill(e)}${advPill(e)}`:""}
          ${e.result&&e.time?`<span class="pill ent">申込 ${esc(e.time)}</span>`:""}
          ${tags(e)}</div>${memLine(e)}</div>`; }).join("")}
      <div style="height:12px"></div>${nav}`;
  }

  const cnt = no => ENTRIES.filter(e => (e.programNos||[]).includes(no)).length
                  + RELAYS.filter(r => (r.programNos||[]).includes(no)).length;
  // 組数は申込数から数える。公式の日程表と食い違うときだけ、その旨を添える。
  const heatInfo = p => {
    const n = cnt(p.no); if(!n) return "";
    const h = Math.ceil(n / LANES.length);
    if(!p.heats) return `・${h}組（予想）`;
    // 公式の組数が分かっている場合は必ずそれを主表示にする。申込数からの計算値は
    // 食い違うときだけ参考値として添える（公式より予想を前面に出さない）。
    return p.heats === h ? `・${h}組` : `・${p.heats}組（申込${n}件からの参考値は${h}組）`;
  };
  return segs + pg.map(p=>`<div class="pg ${gcls(p.gender)}" data-no="${p.no}">
      <div class="pg-r">
        <span class="pg-no">No.${p.no}</span>
        <span class="pg-nm">${esc((p.distance||"")+" "+(p.stroke||""))}</span>
        <span class="pill ${gcls(p.gender)}">${glabel(p.gender)}</span>
        ${p.startTime?`<span class="pg-tm">${esc(p.startTime)}</span>`:""}
      </div>
      <div class="pg-mt">${p.classGrade?`<b style="color:var(--fg)">${esc(p.classGrade)}</b>　`:""}${esc(p.day||"")} ${esc(p.round||"")}${cnt(p.no)?`・${cnt(p.no)}件${esc(p.note ? "・"+p.note : heatInfo(p))}`:(p.note?`・${esc(p.note)}`:"")}</div>
    </div>${p.breakAfter?`<div class="brk">${esc(p.breakAfter)}</div>`:""}`).join("");
}
function pgHead(p){
  if(!p) return "";
  return `<div class="gsec ${gcls(p.gender)}">No.${p.no} ${gmark(p.gender)} ${esc((p.distance||"")+" "+(p.stroke||""))}${p.classGrade?" "+esc(p.classGrade):""}
    <span class="n">${p.startTime?"予定 "+esc(p.startTime)+" ／ ":""}${esc(p.day||"")} ${esc(p.round||"")}</span></div>`;
}

/* ---------- タブ4：リレー ---------- */
function viewRl(){
  const m = new Map();
  for(const r of RELAYS){
    const rd0 = (PROG_BY_NO.get((r.programNos||[])[0]) || {}).round || "";
    const k = glabel(r.gender) + " " + (r.event || ((r.distance||"")+" "+(r.stroke||"")))
            + (rd0 && rd0 !== "予選" ? " " + rd0 : "");
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  let h = "";
  // 予選→B決勝→決勝の順に、種目ごとにまとまるようプログラム番号順で出す
  const order = [...m.entries()].sort((a,b)=>
    Math.min(...a[1].map(r => (r.programNos||[999])[0])) -
    Math.min(...b[1].map(r => (r.programNos||[999])[0])));
  for(const [k, list0] of order){
    const done = hasRes(list0);
    const list = done ? [...list0].sort((a,b)=> resKey(a)-resKey(b) || resSec(a)-resSec(b))
                      : [...list0].sort((a,b)=> ordKey(a)-ordKey(b));
    const g = k.startsWith("女子") ? "f" : k.startsWith("混合") ? "x" : "m";
    h += `<div class="gsec ${g}">${k}<span class="n">${done?"🏁 結果・":""}${list.length}チーム</span></div>`;
    h += list.map((r,i)=>`<div class="sw ${g}${isHL(r.team)?" hl":""}">
      <div class="sw-r1">
        ${done
          ? (r.result && r.result.rank
              ? `<span class="rkno${r.result.rank===1&&isFinalA(r)?" m1":""}">${medalOf(r)||r.result.rank}</span>`
              : `<span class="rkno" style="background:rgba(140,155,185,.14);color:var(--muted)">-</span>`)
          : `<span class="sw-bd" style="margin:0 6px 0 0;background:rgba(255,204,102,.13);color:var(--gold)">${i+1}</span>`}
        <span class="sw-nm">${esc(r.team)}</span>${hlPill(r.team)}
        ${r.grade?`<span class="pill">${esc(shortGrade(r.grade))}</span>`:""}
        ${hitStd(r)?`<span class="pill t">★突破</span>`:""}
        ${r.note?`<span class="pill">${esc(r.note)}</span>`:""}
        ${done
          ? (r.result && r.result.note ? `<span class="sw-bd">${esc(r.result.note)}</span>`
             : r.result && r.result.time ? `<span class="sw-bd" style="color:var(--gold)">${esc(r.result.time)}</span>${recMk(r)}` : "")
          : tmTag(r,"span","sw-bd")}
      </div>
      ${memLine(r)}
    </div>`).join("");
  }
  return h || `<div class="empty"><span class="e">🔄</span>リレーの申込データがありません</div>`;
}

/* ---------- タブ5：組・レーン ---------- */
function rcHead(r){
  if(!r) return "";
  const cls = r.mixGender ? "m" : gcls(r.gender);
  const t0 = (PG_BY_NO.get(r.nos[0])||{}).startTime;
  return `<div class="gsec ${cls}">No.${r.nos.join("・")} ${raceMark(r)} ${esc(raceEvent(r))}
    <span class="n">${t0?"予定 "+esc(t0)+" ／ ":""}${esc(r.day||"")} ${esc(r.round||"")}${r.label?" ／ "+esc(r.label):""}</span></div>`;
}
function viewLn(){
  // 出場者が決まっていないレース（予選の結果待ちの決勝など）は選択肢に出さない
  const shown = RACES.filter(r => raceList(r).length);
  const opts = shown.map(r=>`<option value="${esc(r.key)}" ${ST.raceKey===r.key?"selected":""}>No.${r.nos.join("・")} ${esc(r.day||"")} ${r.mixGender?"男女":glabel(r.gender)} ${esc(raceEvent(r))}${r.label?" "+esc(r.label):""}</option>`).join("");
  const head = `<select id="lnSel"><option value="">— レースを選んでください —</option>${opts}</select>`;

  const r = ST.raceKey == null ? null : RACES.find(x => x.key === ST.raceKey);
  if(!r)
    return head + `<div class="empty"><span class="e">🏁</span>レースを選ぶと<br>組とレーンを表示します</div>`;

  const list = raceList(r);
  const UNIT = list.length && list.every(e => e.isRelay) ? "チーム" : "名";
  if(!list.length) return head + rcHead(r) + `<div class="empty"><span class="e">🫧</span>このレースの申込がありません</div>`;

  const confirmed = META.laneConfirmed && list.every(e => e.heat && e.lane != null);
  let heats;
  if(confirmed){
    const m = new Map();
    for(const e of list){
      if(!m.has(e.heat)) m.set(e.heat, {n:0, seat:new Map()});
      m.get(e.heat).seat.set(e.lane, e); m.get(e.heat).n++;
    }
    heats = [...m.entries()].sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  } else {
    heats = buildHeats(list);
  }

  const hp = heatPlan(r);
  const together = (r.nos.length > 1 || r.classes.length > 1)
    ? `<div class="note"><b>${esc(r.classes.join("・"))}</b>が<b>同じ組で一緒に泳ぎます</b>${r.nos.length>1?`（No.${r.nos.join("・")}）`:""}。
        順位・賞状は<b>学年区分ごと</b>です。同じ組で先にゴールした人がいても、区分が違えば順位は別に付きます。</div>`
    : "";
  const note = confirmed
    ? `<div class="note">大会プログラム掲載の<b>確定した組・レーン</b>です。棄権等で当日変わる場合があります。</div>`
    : `<div class="note">これは<b>予想</b>で、公式のスタートリストではありません。エントリータイム順・${LANES.length}レーン想定で計算しています。
        第1組＝最も遅い組、組内は速い順に ${laneOrder(LANES).join("→")} の順で並べ、NT（タイムなし）は最も遅い扱いです。</div>`;

  const body = heats.map((h,hi)=>`<div class="heat">
      <div class="heat-h"><b>第${hi+1}組</b>${hp && hp[hi] ? `<span class="pill clk">⏰ ${clockText(hp[hi])}</span>` : ""}<span class="n">${h.n}${UNIT}${hi===0&&!confirmed?" ／ 最も遅い組":""}${hi===heats.length-1&&heats.length>1&&!confirmed?" ／ 最も速い組":""}</span></div>
      ${LANES.map(l=>{
        const e = h.seat.get(l);
        if(!e) return `<div class="ln empty-ln"><div class="ln-no">${l}</div><div class="ln-b"><div class="ln-nm">（空き）</div></div></div>`;
        const chb = chBtn(e, "ln", {evLabel:`No.${r.nos.join("・")} ${r.mixGender?"男女":glabel(r.gender)} ${raceEvent(r)}${r.label?" "+r.label:""}`, heat:hi+1, lane:l});
        return `<div class="ln ${gcls(e.gender)}${isMk(e)?" hl":""}"${chb?` data-chrow="${chLast()}"`:""}>
          <div class="ln-no">${l}</div>
          <div class="ln-b">
            <div class="ln-nm">${esc(e.name)}</div>
            <div class="sw-r2">${e.team?`<span class="sw-tm">${esc(e.team)}</span>`:""}${mkPill(e)}${e.grade?`<span class="pill">${esc(shortGrade(e.grade))}</span>`:""}${hitStd(e)?`<span class="pill t">★</span>`:""}</div>
            ${memLine(e)}
          </div>
          ${e.result ? `<div class="ln-tm" style="color:var(--gold)">${esc(e.result.time || e.result.note || "")}${
              e.result.rank?` <span class="pill rk${e.result.rank===1&&isFinalA(e)?" m1":""}">${medalOf(e)}${e.result.rank}位</span>${ovPill(e)}${advPill(e)}`:""}${recMk(e)}</div>`
            : tmTag(e,"div","ln-tm")}${chb}</div>`;
      }).join("")}
    </div>`).join("");

  const ri = RACES.findIndex(x => x.key === r.key);
  const rpv = RACES[ri-1], rnx = RACES[ri+1];
  const rlab = x => `No.${x.nos.join("・")} ${x.mixGender?"男女":(isF(x.gender)?"女":"男")} ${esc(raceEvent(x).replace("メドレーリレー","MR").replace("フリーリレー","FR").replace("個人メドレー","IM").replace("バタフライ","バタ").replace("平泳ぎ","平").replace("背泳ぎ","背").replace("自由形","自"))}${x.label?" "+esc(x.label.replace("年生","")):""}`;
  const rb = (x, d) => x ? `<button class="tab" data-lngo="${d}" style="min-height:52px;flex:1;min-width:0;background:var(--card2);border-radius:11px;border:1px solid var(--border);color:var(--accent);font-size:12px;white-space:normal;line-height:1.3">${d<0?"◀ ":""}${rlab(x)}${d>0?" ▶":""}</button>` : `<span style="flex:1"></span>`;
  const rnav = `<div style="display:flex;gap:8px;margin:0 0 10px">${rb(rpv,-1)}${rb(rnx,1)}</div>`;
  return head + rnav + rcHead(r) + together + note +
    `<div class="count"><b>${list.length}</b>${UNIT} ／ ${heats.length}組（${LANES.length}レーン）</div>` + body + rnav;
}

/* ---------- タブ6：大会情報（meta.info があるときだけ） ---------- */
/* 出身校ごとにまとめ、行の主役は進んだ先（チーム名）にする。
   「どこから、どこへ行けるか」を見せるための画面。 */
function viewOg(){
  const by = new Map();
  for(const s of OGLIST){ if(!by.has(s.origin)) by.set(s.origin, []); by.get(s.origin).push(s); }
  const groups = [...by.entries()].sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0],"ja"));
  const teams  = new Set(OGLIST.map(s => s.team));
  let h = `<div class="ostat">
      <div><b>${OGLIST.length}</b><span>${esc(OG.unitLabel||"人")}</span></div>
      <div><b>${teams.size}</b><span>${esc(OG.toLabel||"進んだ先")}</span></div>
      <div><b>${groups.length}</b><span>${esc(OG.fromLabel||"出身校")}</span></div>
    </div>`;
  if(OG.lead) h += `<div class="note">${md(OG.lead)}</div>`;
  for(const [name, list] of groups){
    const us = new Set(list.map(s => s.team));
    h += `<div class="og"><span class="nm">${esc(name)}</span>
      <span class="n">${list.length}${esc(OG.unitLabel||"人")} → ${us.size}${esc(OG.toShort||"大学")}</span></div>`;
    list.sort((a,b) => gradeNum(a.grade)-gradeNum(b.grade) || a.name.localeCompare(b.name,"ja"));
    for(const s of list){
      const evs = (s.evs||[]).map(e => {
        const no = (e.programNos||[])[0];
        const nm = `${esc(e.distance||"")}${esc(e.stroke||"")}`;
        return `<a class="ogev"${no!=null?` data-jev="${no}"`:""}>${nm}${e.result?` ${resPill(e)}`:""}</a>`;
      }).filter(Boolean);
      // 個人種目が無い選手＝リレーで出場する選手。空欄にすると「情報が抜けている」と読まれるので必ず書く。
      const rl = evs.length ? [] : RELAYS
        .filter(r => r.team === s.team && isF(r.gender) === isF(s.gender))
        .sort((a,b) => (a.programNos?.[0]||999) - (b.programNos?.[0]||999))
        .map(r => `${esc(r.distance||"")}${esc(r.stroke||"")}`);
      h += `<div class="orow ${gcls(s.gender)}">
        <div class="to">${esc(s.team)}</div>
        <div class="who"><span class="nm">${esc(s.name)}</span>
          ${s.grade?`<span class="pill">${esc(shortGrade(s.grade))}</span>`:""}
          <span class="pill ${gcls(s.gender)}">${isF(s.gender)?"女子":"男子"}</span></div>
        ${s.originDetail?`<div class="from">🏫 ${esc(s.originDetail)}</div>`:""}
        ${evs.length?`<div class="ev">${evs.join("")}</div>`:""}
        ${rl.length?`<div class="rlv"><b>🏊 リレーで出場</b> <span class="dim">（泳者は当日発表）</span><br>${rl.join("／")}</div>`:""}
      </div>`;
    }
  }
  if(OG.note) h += `<div class="note" style="margin-top:16px">${md(OG.note)}</div>`;

}

/* ---------- タブ：当日プラン ----------
   meta.dayPlan と program[].startTime があるときだけ出る。
   選手を選ぶと、その子のレース予定時刻から 補食→招集→レース→ダウン を逆算して1日ぶん並べる。 */
const hhmm = t => { const m = String(t||"").match(/^(\d{1,2}):(\d{2})$/); return m ? (+m[1])*60 + (+m[2]) : null; };
const fmtm = v => Math.floor(v/60) + ":" + String(v%60).padStart(2,"0");

/* ---------- 組ごとの予定時刻（program[].startTime・endTime があるときだけ） ----------
   日程表に載るのは種目ごとの開始時刻だけ。種目の持ち時間（startTime〜endTime）を、
   各組の「いちばん遅いエントリータイム＋入れ替えの時間」で割り振って、組ごとの泳ぎ出しの目安を出す。
   入れ替えの時間は（持ち時間 − 各組の最遅タイムの合計）÷ 組数。公式の時刻表もほぼこの作りになっている。
   組・レーンが予想なら時刻も目安。招集に遅れないよう分は切り捨てる。endTime が無ければ種目の開始時刻だけ出す。 */
const HEAT_PLAN = new Map();
function raceHeats(list){
  if(META.laneConfirmed && list.every(e => e.heat && e.lane != null)){
    const m = new Map();
    for(const e of list){
      if(!m.has(e.heat)) m.set(e.heat, {n:0, seat:new Map()});
      m.get(e.heat).seat.set(e.lane, e); m.get(e.heat).n++;
    }
    return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  }
  return buildHeats(list);
}
function heatPlan(r){
  if(!r) return null;
  if(HEAT_PLAN.has(r.key)) return HEAT_PLAN.get(r.key);
  const p  = PG_BY_NO.get(r.nos[0]) || {};
  const t0 = hhmm(p.startTime), t1 = hhmm(p.endTime);
  const list = raceList(r);
  let out = null;
  if(t0 != null && list.length){
    const heats = raceHeats(list);
    const slow  = heats.map(h => Math.max(0, ...[...h.seat.values()].map(secOf).filter(isFinite)));
    const span  = (t1 != null && t1 > t0) ? (t1 - t0) * 60 : null;
    const gap   = span == null ? 0 : Math.max(0, (span - slow.reduce((a,b)=>a+b, 0)) / heats.length);
    let acc = 0;
    out = heats.map((h, i) => {
      const t = span == null ? t0 : t0 + Math.floor(acc / 60);
      acc += slow[i] + gap;
      return {heat:i+1, of:heats.length, t, est:span != null, seat:h.seat};
    });
  }
  HEAT_PLAN.set(r.key, out);
  return out;
}
/* そのエントリーが 何時ごろ・第何組・何レーンか */
function clockOf(e){
  const no = (e.programNos||[])[0];
  const hp = heatPlan(RACE_BY_NO.get(no)); if(!hp) return null;
  const same = x => x === e
    || (x.id && e.id && x.id === e.id && x.programNos?.[0] === no)
    || (x.isRelay && !e.id && x.name === e.team && x.time === e.time && x.note === e.note && x.programNos?.[0] === no);
  for(const h of hp) for(const [lane, x] of h.seat)
    if(same(x)) return {heat:h.heat, of:h.of, lane, t:h.t, est:h.est};
  return null;
}
const clockText = c => fmtm(c.t) + (c.est ? "ごろ" : "〜");

/* その選手のそのエントリーが、予想で第何組の何レーンになるか */
function seatOf(e){
  const r = RACE_BY_NO.get((e.programNos||[])[0]); if(!r) return null;
  const heats = buildHeats(raceList(r));
  for(let i=0;i<heats.length;i++)
    for(const [lane, x] of heats[i].seat)
      if(x === e || (x.id && e.id && x.id === e.id && x.programNos?.[0] === e.programNos?.[0]))
        return {heat:i+1, lane:lane, of:heats.length};
  return null;
}

const tv = v => { const t = hhmm(v); return t == null ? "" : String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); };

/* 1人ぶんのレース。時刻は予想の組の泳ぎ出し（無ければ種目の開始時刻）。 */
function dpRaces(sw){
  return (sw.evs||[]).map(e => {
    const p = PG_BY_NO.get((e.programNos||[])[0]); if(!p) return null;
    const c = clockOf(e);
    const t = c ? c.t : hhmm(p.startTime);
    return t == null ? null : {e, p, c, t};
  }).filter(Boolean).sort((a,b) => a.t - b.t);
}

function dpPlan(list){
  const DP = META.dayPlan || {};
  const call = DP.callMinutes || 10, dn = DP.downMinutes || 15;
  const my = DPS.my, multi = list.length > 1;
  const items = [], warns = [], all = [];
  const add = o => { if(o.t != null && isFinite(o.t) && o.t >= 0 && o.t < 1440) items.push(o); };
  for(const f of (DP.fixed||[]))
    add({id:"fix:"+f.time+":"+f.label, t:hhmm(f.time), o:0, kind:"fix", label:f.label, note:f.note||"", src:DP.fixedSource||"大会の案内"});
  const wake = hhmm(my.wake), arrival = hhmm(my.arrival), bfIn = hhmm(my.breakfast);
  add({id:"my:wake", t:wake, o:0, kind:"mine", label:"起床", src:"自分の入力"});
  add({id:"my:arrival", t:arrival, o:0, kind:"mine", label:"会場到着", note:"集合場所・荷物置き場・トイレを確認。", src:"自分の入力"});
  add({id:"my:breakfast", t:bfIn, o:1, kind:"meal", label:"朝食", note:"食べ慣れた物を、体調に合わせて。", src:"自分の入力"});
  my.custom.forEach((c, i) => { if(c.text.trim())
    add({id:"my:c:"+i+":"+c.time+":"+c.text, t:hhmm(c.time), o:0, kind:"mine", label:c.text.trim(), src:"自分の入力"}); });
  const warm = hhmm(DP.warmStart), warmEnd = hhmm(DP.warmEnd);
  if(wake != null && arrival != null && arrival < wake) warns.push("会場到着が起床より前になっています。");
  if(arrival != null && warmEnd != null && arrival > warmEnd)
    warns.push("会場到着が朝のアップの終わり（" + DP.warmEnd + "）より後です。コーチに確認してください。");

  for(const sw of list){
    const rs = dpRaces(sw); if(!rs.length) continue;
    const sk = KEY(sw), who = multi ? sw.name : "", pre = who ? who + "：" : "";
    const gIn = r => hhmm(my.gather[sk + "|" + r.p.no]);
    const gat = r => { const g = gIn(r); return g != null ? g : r.t - call; };
    const first = rs[0].t, last = rs[rs.length-1].t;
    // 着替え・アップ準備は朝の全体アップを使う想定。到着より前には置かない
    const prep = Math.max(arrival ?? 0, Math.min(first - 50, warm ?? (first - 50)));
    const breakfast = bfIn ?? Math.max(wake == null ? 0 : wake + 20, prep - 120);
    if(bfIn == null) add({id:"bf:"+sk, t:breakfast, o:1, kind:"meal", label:pre+"朝食の目安", note:DP_NOTE.breakfast, src:"目安"});
    add({id:"prep:"+sk, t:prep, o:1, kind:"prep", label:pre+"着替え・アップ準備", note:DP_NOTE.prep, src:"目安"});
    // 昼食：次の集合まで約2時間あくところ。出番の直前にかかるなら、その出番の後ろへずらす
    let lunch = hhmm(DP.lunchFrom) ?? 690;
    for(const r of rs){ if(lunch + 120 > gat(r) && lunch < r.t + 20) lunch = r.t + 20; }
    lunch = Math.max(lunch, arrival ?? 0);
    add({id:"lunch:"+sk, t:lunch, o:1, kind:"meal", label:pre+"昼食の目安", note:DP_NOTE.lunch, src:"目安"});
    let lastFood = breakfast, lastDown = last;
    rs.forEach((r, i) => {
      const prev = i ? rs[i-1].t : null, next = rs[i+1], g = gat(r), snack = r.t - 60;
      if(snack >= lunch) lastFood = Math.max(lastFood, lunch);
      if(snack >= lastFood + 90 && Math.abs(snack - lunch) >= 60 && (prev == null || snack >= prev + 20)
         && snack >= (wake ?? 0) && snack < g){
        add({id:"snack:"+sk+":"+r.p.no, t:snack, o:1, kind:"meal", label:pre+"補食の候補", note:DP_NOTE.snack, src:"目安", food:true});
        lastFood = snack;
      }
      if(i && r.t - prev >= 90)
        add({id:"next:"+sk+":"+r.p.no, t:Math.max(prev + 20, g - 30, arrival ?? 0), o:1, kind:"prep",
             label:pre+"次の出番の準備", note:DP_NOTE.next, src:"目安"});
      if(gIn(r) != null){
        add({id:"gat:"+sk+":"+r.p.no, t:gIn(r), o:2, kind:"call", label:pre+"コーチの集合（No."+r.p.no+"）",
             note:"コーチ・主催者の案内を優先。", src:"自分の入力"});
        if(gIn(r) > r.t) warns.push(pre + "No." + r.p.no + " のコーチの集合が、泳ぐ時刻より後になっています。");
      }
      add({id:"call:"+sk+":"+r.p.no, t:r.t - call, o:2, kind:"call", label:pre+"招集（No."+r.p.no+"）",
           note:fmtm(r.t - call) + " までに招集所へ。遅れると泳げない。", src:"競技の" + call + "分前まで"});
      add({id:"race:"+sk+":"+r.p.no, t:r.t, o:3, kind:"race", race:r, who});
      // ダウンは次の招集に食い込ませない。入る余地が無いときは「すぐ次の招集へ」
      const limit = next ? next.t - call - 3 : Infinity;
      if(r.t + 3 <= limit){
        const dnT = Math.max(r.t + 3, Math.min(r.t + dn, limit)), tight = dnT < r.t + dn;
        add({id:"down:"+sk+":"+r.p.no, t:dnT, o:4, kind:"down", label:pre+"ダウン・水分", src:"目安",
             note: tight ? (DP.tightNote || "次の招集まで時間がありません。軽く流して、すぐ招集へ。")
                         : (DP.downNote || "ゆっくり泳いで整える。体を冷やさないように。")});
        lastDown = dnT;
      }else{
        add({id:"down:"+sk+":"+r.p.no, t:r.t + 1, o:4, kind:"down", label:pre+"すぐ次の招集へ", src:"目安",
             note: DP.noRoomNote || "ダウンの時間がありません。水分だけとって招集所へ。ダウンは次のレースのあとで。"});
        lastDown = r.t + 1;
      }
    });
    add({id:"fin:"+sk, t:Math.max(last + 20, lastDown + 5), o:5, kind:"down", label:pre+"泳ぎ終わったら", note:DP_NOTE.finish, src:"目安"});
    all.push(...rs.map(r => Object.assign({who: sw.name}, r)));
  }
  // 兄弟・姉妹の出番が近いと、付き添いが重なる
  all.sort((a,b) => a.t - b.t);
  for(let i = 1; i < all.length; i++){
    const a = all[i-1], b = all[i];
    if(a.who !== b.who && b.t - a.t < 20)
      warns.push(`${a.who}（No.${a.p.no} ${fmtm(a.t)}ごろ）と ${b.who}（No.${b.p.no} ${fmtm(b.t)}ごろ）の出番が${b.t - a.t}分差です。付き添いを確認してください。`);
  }
  items.sort((a,b) => a.t - b.t || a.o - b.o);
  return {items, warns, n: all.length};
}

const dpTitle = x => x.kind === "race"
  ? (x.who ? x.who + "：" : "") + `No.${x.race.p.no} ${x.race.p.distance||""} ${x.race.p.stroke||""}`.trim()
  : x.label;
const dpFoodsOf = id => (DPS.foods[id] || []).map(f => DP_FOODS.find(x => x[0] === f)).filter(Boolean);

function dpNext(items){
  const DP = META.dayPlan || {}, now = dpNow();
  if(DP.date && now.date > DP.date) return "";
  const x = items.find(i => !DPS.done[i.id]);
  if(!x) return `<div class="dpnext" id="dpNext"><div class="nx">✅ 予定はぜんぶ済みました</div></div>`;
  const today = !DP.date || now.date === DP.date;
  const lb = !today ? `当日（${esc(DP.dateLabel || DP.date)}）の最初の予定`
           : x.t < now.t ? "時刻を過ぎた、まだ済んでいない予定" : "次の予定";
  return `<div class="dpnext" id="dpNext"><span class="lb">${lb}・日本時間</span>
    <div class="nx"><b>${fmtm(x.t)}</b>${esc(dpTitle(x))}</div>${x.note ? `<div class="tn">${md(x.note)}</div>` : ""}
    <button data-dpdone="${esc(x.id)}">済みました ✓</button></div>`;
}

function dpRow(x){
  const done = !!DPS.done[x.id];
  const ck = (title, src) => `<label class="ck"><input type="checkbox" data-dpck="${esc(x.id)}"${done ? " checked" : ""}>
      <span class="tt">${title}</span>${src ? `<span class="pill">${esc(src)}</span>` : ""}</label>`;
  if(x.kind === "race"){
    const {e, p, c} = x.race;
    return `<div class="tlr race ${gcls(e.gender)}${done ? " dn" : ""}"><span class="ti">${fmtm(x.t)}</span>
      ${ck(`No.${p.no} ${esc((p.distance||"") + " " + (p.stroke||""))}`, "")}
      <div class="sw-r2 sub">${x.who ? `<span class="pill ${gcls(e.gender)}">${esc(x.who)}</span>` : ""}
        ${p.classGrade ? `<span class="pill">${esc(p.classGrade)}</span>` : ""}<span class="pill">申込 ${esc(showTime(e))}</span>
        ${c ? `<span class="pill clk">${META.laneConfirmed ? "" : "予想 "}第${c.heat}組 ${c.lane}レーン</span>` : ""}
        ${p.startTime && hhmm(p.startTime) !== x.t ? `<span class="pill">No.${p.no} 開始 ${esc(p.startTime)}</span>` : ""}</div></div>`;
  }
  let food = "";
  if(x.food){
    const sel = dpFoodsOf(x.id), open = ST.dpFood === x.id, has = new Set(DPS.foods[x.id] || []);
    food = `<div class="tn">${sel.length ? "選んだ補食：" + sel.map(f => esc(f[1] + " " + f[2])).join("／") + "　" : ""}
        <button class="dplink" data-dpfo="${esc(x.id)}">${open ? "とじる" : sel.length ? "食品を変える" : "食品をえらぶ"}</button></div>`
      + (open ? `<div class="dpfood">${DP_FOODS.map(f => `<button data-dpfd="${esc(x.id)}|${f[0]}" aria-pressed="${has.has(f[0])}">
          <b>${f[1]} ${esc(f[2])}</b><span>${esc(f[3])}</span></button>`).join("")}</div>` : "");
  }
  return `<div class="tlr ${x.kind}${done ? " dn" : ""}"><span class="ti">${fmtm(x.t)}</span>
    ${ck(esc(x.label), x.src)}${x.note ? `<div class="tn">${md(x.note)}</div>` : ""}${food}</div>`;
}

const dpSec = (id, title, body) => `<details class="dpd" data-dpsec="${id}"${ST.dpSec.has(id) ? " open" : ""}>

function viewDp(){

  const sel = dpSel();
  if(!sel.length || ST.dpAdd){
    const q = nx(ST.q), qk = nk(ST.q);
    let list = SWL.filter(s => !sel.includes(s));
    if(q) list = list.filter(s => s._n.includes(q) || s._t.includes(q) || (qk && s._k.includes(qk)));
    const body = !ST.q
      ? `<div class="empty"><span class="e">🕐</span>${ST.dpAdd ? "いっしょにする人を<br>名前かチームで探してください" : "選手を選ぶと、その子の<br>1日の動き方が出ます"}</div>`
      : list.length
        ? `<div class="count"><b>${list.length}</b>名が該当</div>` +

      : `<div class="note">${md(DP.intro || "選手を選ぶと、レースの時刻から**招集・食事の目安・ダウン**を逆算して並べます。")}</div>`;

  const {items, warns, n} = dpPlan(sel);

  const head = `<div class="dpsel">${sel.map(s => `<span class="chip ${gcls(s.gender)}">${esc(s.name)}<small>${esc(s.team)}</small>
