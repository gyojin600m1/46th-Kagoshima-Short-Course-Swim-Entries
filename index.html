    + `<div class="empty"><span class="e">🫧</span>この選手の個人種目に<br>予定時刻が入っていません</div>`;

  const races = sel.flatMap(s => dpRaces(s).map(r => ({s, r})));
  const inputs = dpSec("my", "✏️ 自分で入れる時刻・メモ", `
      <div class="dpf">
        <label>起床<input type="time" data-dpmy="wake" value="${tv(my.wake)}"></label>
        <label>会場到着<input type="time" data-dpmy="arrival" value="${tv(my.arrival)}"></label>
        <label class="full">朝食（自分で決めた時刻）<input type="time" data-dpmy="breakfast" value="${tv(my.breakfast)}"></label>
      </div>
      <div class="dph">コーチの集合時刻（分かれば）</div>
      ${races.map(({s, r}) => { const k = KEY(s) + "|" + r.p.no;
        return `<label class="dpl">No.${r.p.no} ${esc((r.p.distance||"") + (r.p.stroke||""))}${sel.length > 1 ? "（" + esc(s.name) + "）" : ""}・${fmtm(r.t)}ごろ
          <input type="time" data-dpg="${esc(k)}" value="${tv(my.gather[k])}"></label>`; }).join("")}
      <div class="dph">追加の予定</div>
      ${my.custom.map((c, i) => `<div class="dpc"><input type="time" data-dpcu="${i}|time" value="${tv(c.time)}" aria-label="時刻">
          <input type="text" data-dpcu="${i}|text" value="${esc(c.text)}" placeholder="例：チームで集合" aria-label="内容">
          <button data-dpcx="${i}" aria-label="この予定を消す">×</button></div>`).join("")}
      <button class="dpbtn" id="dpCuAdd">＋ 予定を追加</button>
      <label class="dpl" style="margin-top:10px">コーチの指示・メモ
        <textarea data-dpmy="notes" placeholder="例：アップはチーム集合のあと。ゴーグルを2つ持っていく。">${esc(my.notes)}</textarea></label>`);
  const kit = DP.kit || DP_KIT, tips = DP.tips || DP_TIPS;
  return `<button class="tab dpback" id="dpBack">← ほかの選手を選ぶ</button>` + head + dpNext(items)
    + (my.notes ? `<div class="note">📝 ${md(my.notes)}</div>` : "")
    + `<div class="note">${md(DP.caution || "時刻は予定です。進行がずれることがあります。")}</div>`
    + warns.map(w => `<div class="note dpw">⚠️ ${esc(w)}</div>`).join("")
    + inputs
    + `<div class="tl">${items.map(dpRow).join("")}</div>`
    + `<div class="dpact"><button class="dpbtn" id="dpCopy">📋 予定をコピー</button><button class="dpbtn" id="dpPrint">🖨 印刷・PDF</button></div>`
    + dpSec("kit", "🎒 持ち物チェック", `<div class="dpkit">${kit.map((k, i) =>
        `<label><input type="checkbox" data-dpkit="${i}"${DPS.kit[i] ? " checked" : ""}>${esc(k)}</label>`).join("")}</div>
        <p class="tn">チーム指定の持ち物も確認してください。</p>`)
    + dpSec("tips", "👪 親子でできる、小さな準備", tips.map(t => `<div class="dph">${esc(t[0])}</div><p class="tn">${esc(t[1])}</p>`).join(""))
    + dpSec("guide", "📖 食事・水分・アップの考え方", DP_GUIDE.map(g => `<div class="dph">${esc(g[0])}</div><p class="tn">${esc(g[1])}</p>`).join("")
        + `<div class="dph">参考にした資料</div><ul class="dpref">${DP_REFS.map(r =>
          `<li><a href="${esc(r[0])}" target="_blank" rel="noopener">${esc(r[1])}</a></li>`).join("")}</ul>
        <p class="tn">個人が公開資料を参考に作ったヒントで、専門家の監修は受けていません。持病・食物アレルギー・個別の食事や運動の計画は、担当の専門職に相談してください。</p>`)
    + dpSec("memo", "🗒 次の大会に残すメモ", `<label class="dpl">食べやすかった物・準備でよかったこと
        <textarea data-dpmemo placeholder="例：ゼリーは食べやすかった。次は集合場所を早めに確認する。">${esc(DPS.memo)}</textarea></label>`)
    + `<div class="note">${md(DP.mealNote || DP_MEAL_NOTE)}</div>`
    + `<p class="dpsave">${DPS_OK ? "入力・チェックは、この端末（ブラウザ）だけに保存しています。外部には送りません。"
                                  : "この端末では保存できません。閉じる前に、コピーか印刷で残してください。"}</p>`;
}

function dpCopy(btn){
  const sel = dpSel(), {items, warns} = dpPlan(sel), DP = META.dayPlan || {};
  const line = x => (DPS.done[x.id] ? "✓ " : "") + fmtm(x.t) + " " + dpTitle(x)
    + (x.kind === "race" && x.race.c ? `（${META.laneConfirmed ? "" : "予想 "}第${x.race.c.heat}組 ${x.race.c.lane}レーン）` : "")
    + (x.food && dpFoodsOf(x.id).length ? " 補食：" + dpFoodsOf(x.id).map(f => f[2]).join("／") : "");
  const txt = [META.title, ((DP.dateLabel || "") + " " + sel.map(s => s.name).join("・")).trim(),
    ...warns.map(w => "確認：" + w), ...items.map(line),
    DPS.my.notes ? "メモ：" + DPS.my.notes : "", "※時刻は目安です。当日の案内を優先してください。"].filter(Boolean).join("\n");
  const ok = () => { btn.textContent = "✅ コピーしました"; setTimeout(() => { btn.textContent = "📋 予定をコピー"; }, 2500); };
  const fb = () => {
    const a = document.createElement("textarea"); a.value = txt; document.body.appendChild(a); a.select();
    let r = false; try{ r = document.execCommand("copy"); }catch(_){}
    a.remove(); if(r) ok(); else btn.textContent = "コピーできません。印刷をどうぞ";
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
}

function dpBind(){
  if(ST.tab !== "dp") return;
  const one = s => M.querySelector(s), all = s => M.querySelectorAll(s);
  const c = one("#dpCancel"); if(c) c.onclick = () => { ST.dpAdd = false; ST.q = ""; render(); };
  const a = one("#dpAdd"); if(a) a.onclick = () => { ST.dpAdd = true; ST.q = ""; render(); };
  const b = one("#dpBack"); if(b) b.onclick = () => { DPS.keys = []; ST.q = ""; dpSave(); render(); };
  all("[data-dprm]").forEach(x => x.onclick = () => { DPS.keys = DPS.keys.filter(k => k !== x.dataset.dprm); dpRer(); });
  all("[data-dpck]").forEach(x => x.onchange = () => {
    if(x.checked) DPS.done[x.dataset.dpck] = true; else delete DPS.done[x.dataset.dpck]; dpRer(); });
  all("[data-dpdone]").forEach(x => x.onclick = () => { DPS.done[x.dataset.dpdone] = true; dpRer(); });
  all("[data-dpmy]").forEach(x => x.onchange = () => { DPS.my[x.dataset.dpmy] = x.value; dpRer(); });
  all("[data-dpg]").forEach(x => x.onchange = () => {
    if(x.value) DPS.my.gather[x.dataset.dpg] = x.value; else delete DPS.my.gather[x.dataset.dpg]; dpRer(); });
  all("[data-dpcu]").forEach(x => x.onchange = () => {
    const [i, f] = x.dataset.dpcu.split("|"), c = DPS.my.custom[+i]; if(c){ c[f] = x.value; dpRer(); } });
  all("[data-dpcx]").forEach(x => x.onclick = () => { DPS.my.custom.splice(+x.dataset.dpcx, 1); dpRer(); });
  const ca = one("#dpCuAdd"); if(ca) ca.onclick = () => { DPS.my.custom.push({time:"", text:""}); dpRer(); };
  all("[data-dpfo]").forEach(x => x.onclick = () => { ST.dpFood = ST.dpFood === x.dataset.dpfo ? null : x.dataset.dpfo; dpRer(); });
  all("[data-dpfd]").forEach(x => x.onclick = () => {
    const [id, f] = x.dataset.dpfd.split("|"), s = new Set(DPS.foods[id] || []);
    if(s.has(f)) s.delete(f); else s.add(f);
    if(s.size) DPS.foods[id] = [...s]; else delete DPS.foods[id]; dpRer(); });
  all("[data-dpkit]").forEach(x => x.onchange = () => {
    if(x.checked) DPS.kit[x.dataset.dpkit] = true; else delete DPS.kit[x.dataset.dpkit]; dpSave(); });
  const mm = one("[data-dpmemo]"); if(mm) mm.onchange = () => { DPS.memo = mm.value; dpSave(); };
  all("details[data-dpsec]").forEach(d => d.ontoggle = () => {
    if(d.open) ST.dpSec.add(d.dataset.dpsec); else ST.dpSec.delete(d.dataset.dpsec); });
  const cp = one("#dpCopy"); if(cp) cp.onclick = () => dpCopy(cp);
  const pr = one("#dpPrint"); if(pr) pr.onclick = () => window.print();
}
// 「次の予定」は時刻で変わるので、当日プランを開いている間は1分ごとにカードだけ描き直す
setInterval(() => {
  if(ST.tab !== "dp" || ST.dpAdd) return;
  const el = document.getElementById("dpNext"), sel = dpSel(); if(!el || !sel.length) return;
  const tmp = document.createElement("div"); tmp.innerHTML = dpNext(dpPlan(sel).items);
  const nn = tmp.firstElementChild; if(!nn) return;
  el.replaceWith(nn);
  const b = nn.querySelector("[data-dpdone]"); if(b) b.onclick = () => { DPS.done[b.dataset.dpdone] = true; dpRer(); };
}, 60000);

// **強調** だけ通す最小マークダウン（それ以外はエスケープ）
/* 注意書き用のごく小さな記法。**太字** と改行だけ。HTMLタグは書けない（そのまま文字として出る）。 */
function md(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\r?\n/g, "<br>"); }

/* ---------- イベント配線 ---------- */
function bind(){
  const q = M.querySelector("#q");
  if(q){
    // 変換中(isComposing)に再描画すると入力欄のDOMごと作り直されてIMEの変換セッションが壊れ、
    // ローマ字入力が変になる（例: 「みや」と打っている途中で確定されたり文字が抜けたりする）。
    // 変換中は ST.q だけ更新して再描画を待ち、確定時(compositionend)にまとめて反映する。
    q.oninput = (e) => { ST.q = q.value; if(e.isComposing) return; const p = q.selectionStart; redrawKeepFocus(p); };
    q.oncompositionend = () => { ST.q = q.value; const p = q.selectionStart; redrawKeepFocus(p); };
    M.querySelector("#qc").onclick = () => { ST.q = ""; render(); };
  }
  M.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { ST.gender = b.dataset.g; render(); });
  M.querySelectorAll("[data-tm]").forEach(b => b.onclick = () => { ST.q = b.dataset.tm; ST.hl = false; render(); });
  M.querySelectorAll("[data-hl]").forEach(b => b.onclick = () => { ST.hl = !ST.hl; ST.q = ""; if(!ST.hl) ST.hlDay = "all"; render(); });
  M.querySelectorAll("[data-hd]").forEach(b => b.onclick = () => { ST.hlDay = b.dataset.hd; render(); });
  M.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { ST.day = b.dataset.d; render(); });
  M.querySelectorAll("[data-no]").forEach(b => b.onclick = () => { ST.pgNo = +b.dataset.no; render(); });
  M.querySelectorAll(".sw[data-k]").forEach(c => c.onclick = () => {
    const k = c.dataset.k;
    if(ST.tab === "dp"){ dpPick(k); return; }   // 当日プランは選手を選ぶ操作（兄弟・姉妹は足していく）
    if(ST.open.has(k)) ST.open.delete(k); else ST.open.add(k);
    c.classList.toggle("open");
  });
  // 出身タブなどから「その種目」へ飛ぶ
  M.querySelectorAll("[data-ptg]").forEach(b => b.onclick = () => { ST.ptG = +b.dataset.ptg; render(); });
  M.querySelectorAll("[data-jev]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const i = EV_BY_NO.get(+b.dataset.jev);
    if(i != null){ ST.ev = i; ST.tab = "ev"; render(); }
  });
  M.querySelectorAll("[data-jn]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const r = RACE_BY_NO.get(+b.dataset.jn);
    if(r){ ST.raceKey = r.key; ST.tab = "ln"; render(); }
  });
  const back = M.querySelector("#back"); if(back) back.onclick = () => { ST.pgNo = null; render(); };
  M.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const i = PROGRAM.findIndex(x => x.no === ST.pgNo) + (+b.dataset.go);
    if(PROGRAM[i]){ ST.pgNo = PROGRAM[i].no; render(); }
  });
  M.querySelectorAll("[data-lngo]").forEach(b => b.onclick = () => {
    const i = RACES.findIndex(r => r.key === ST.raceKey) + (+b.dataset.lngo);
    if(RACES[i]){ ST.raceKey = RACES[i].key; render(); }
  });
  M.querySelectorAll(".pgnav").forEach(b => b.onclick = () => {
    const i = PROGRAM.findIndex(x => x.no === ST.pgNo); const p = PROGRAM[i + (+b.dataset.go)];
    if(p){ ST.pgNo = p.no; ST.day = "all"; render(); window.scrollTo(0, 0); }
  });
  const toLn = M.querySelector("#toLn"); if(toLn) toLn.onclick = () => {
    const r = RACE_BY_NO.get(ST.pgNo); ST.raceKey = r ? r.key : null; ST.tab = "ln"; render(); };
  const es = M.querySelector("#evSel"); if(es) es.onchange = () => { ST.ev = +es.value; render(); };
  const ls = M.querySelector("#lnSel"); if(ls) ls.onchange = () => { ST.raceKey = ls.value || null; render(); };
  dpBind();
  // 応援モード：📣ボタン、または（他に押す用の無い）種目・組レーンの行全体
  M.querySelectorAll("[data-ch]").forEach(b => b.onclick = ev => { ev.stopPropagation(); chOpen(+b.dataset.ch); });
  M.querySelectorAll("[data-chrow]").forEach(el => { el.onclick = () => chOpen(+el.dataset.chrow); el.style.cursor = "pointer"; tappable(el, "名前をひらがなで大きく表示"); });
  M.querySelectorAll(".pg[data-no]").forEach(el => tappable(el, "この種目の詳細を見る"));
  M.querySelectorAll(".sw[data-k]").forEach(el => tappable(el, ST.tab === "dp" ? "この選手の当日プランを見る" : "この選手の種目を開く"));
  M.querySelectorAll("[data-jn]").forEach(el => tappable(el, "この種目の組・レーンを見る"));
  M.querySelectorAll("[data-jev]").forEach(el => tappable(el, "この種目を見る"));
}
function redrawKeepFocus(pos){
  CH_ROWS.length = 0;
  M.innerHTML = (ST.tab === "dp" ? viewDp : viewSw)(); bind();
  const q = M.querySelector("#q");
  if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(_){} }
}

                (META.resultsUrl ? `結果: <a href="${esc(META.resultsUrl)}" style="color:var(--accent)">こちら</a><br>` : "") +
                (META.source ? esc(META.source) + "<br>" : "") +
                "© " + new Date().getFullYear() + " gyojin600m1" +
                '<div class="ct" id="ct"></div>';
  M.appendChild(f);
}
const _render = render;
render = function(){ _render(); footer(); count(); };

/* ---------- 閲覧カウンター（meta.counter.ns があるときだけ） ---------- */
let counted = false;
function count(){
  const el = document.getElementById("ct");
  if(!el || !META.counter?.ns) return;
  const NS = META.counter.ns, K = "cnt:" + NS, today = new Date().toISOString().slice(0,10);
  // localStorage が使えない環境（プライベートモード等）でも落とさない
  let hit = true;
  try { hit = localStorage.getItem(K) !== today; } catch(_){ hit = !counted; }
  const url = "https://abacus.jasoncameron.dev/" + (hit && !counted ? "hit" : "get") + "/" + NS + "/views";
  if(hit) { try { localStorage.setItem(K, today); } catch(_){} counted = true; }
  // キーがまだ無いと {"error":...} が返る。数が来たときだけ出す（「undefined 回閲覧」を出さない）。
  fetch(url).then(r=>r.json())
    .then(d=>{ if(typeof d?.value === "number") el.textContent = "👀 " + d.value + " 回閲覧";
               else if(url.indexOf("/get/") > 0) return fetch(url.replace("/get/","/hit/")).then(r=>r.json())
                        .then(d2=>{ if(typeof d2?.value === "number") el.textContent = "👀 " + d2.value + " 回閲覧"; }); })
    .catch(()=>{});
}

render();

/* ---------- 速報中だけ、新しい結果が出たら知らせる ----------
   GitHub Pages が HTML を10分キャッシュするよう指示するため、こちらが更新しても
   見ている人の画面は最大10分古いままになる。同じ場所に置いた live.json（数百バイト）
   だけを見に行き、件数が変わっていたら「新しい結果があります」を出す。
   勝手に読み直すと見ている途中の画面が飛ぶので、タップで更新してもらう。   */
if(LIVE){
  const myN = ENTRIES.filter(e => e.result).length + RELAYS.filter(r => r.result).length;
  const bar = document.createElement("button");
  bar.id = "newres";
  bar.textContent = "🔄 新しい結果があります（タップで更新）";
  bar.style.cssText = "display:none;position:fixed;left:12px;right:12px;bottom:14px;z-index:99;"
    + "min-height:48px;border:0;border-radius:12px;background:var(--accent);color:#04121f;"
    + "font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:pointer";
  bar.onclick = () => location.replace(location.pathname + "?t=" + Date.now());
  document.body.appendChild(bar);
  const check = async () => {
    try{
      const r = await fetch("live.json?t=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      const j = await r.json();
      if(typeof j.n === "number" && j.n !== myN) bar.style.display = "block";
    }catch(_){}
  };
  setInterval(check, 20000);
  // アプリに戻ってきた瞬間にも見に行く（30秒待たせない）
  document.addEventListener("visibilitychange", () => { if(!document.hidden) check(); });
}
</script>
</body>
</html>
